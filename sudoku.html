<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Sudoku</title><style>
.sdk{width:min(100%,520px);margin:auto}.sboard{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;background:var(--text);gap:1px;border:2px solid var(--text)}.sq{border:0;background:var(--card);padding:0;font-size:clamp(18px,6vw,30px);font-weight:650}.sq:nth-child(3n){border-right:2px solid var(--text)}.sq:nth-child(9n){border-right:0}.sq:nth-child(n+19):nth-child(-n+27),.sq:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--text)}.sq.given{font-weight:900}.sq.peer{background:var(--soft)}.sq.same{background:color-mix(in srgb,var(--accent) 23%,var(--card))}.sq.sel{outline:3px solid var(--accent);outline-offset:-3px}.sq.bad{color:var(--danger)}.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.num{height:48px;border:0;border-radius:13px;background:var(--card);font-size:21px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.07)}.num[hidden]{visibility:hidden}.under{display:flex;justify-content:center;gap:8px;margin-top:10px}

.sq{position:relative}
.candidates{position:absolute;inset:3px;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);pointer-events:none}
.cand{font-size:clamp(12px,3.4vw,18px);line-height:1;display:flex;align-items:center;justify-content:center;opacity:.85;font-weight:700}
#notesBtn.active{outline:2px solid currentColor;outline-offset:2px;font-weight:800}
.sq .candidates{color:var(--text)}
</style></head><body>
<header class="appbar"><div class="appbar-inner"><a class="back" href="../index.html">‹</a><div class="app-title">Sudoku</div><div class="spacer"></div><button class="btn" data-options>Opcje ▾</button><button class="btn" data-new>Nowa gra</button><button class="iconbtn" data-theme-button>◐</button></div></header>
<div class="game-options" id="options" hidden><div class="game-options-row"><label for="level">Poziom trudności</label><select class="select" id="level"><option value="1">Poziom 1</option><option value="2">Poziom 2</option><option value="3">Poziom 3</option><option value="4">Poziom 4</option><option value="5">Poziom 5</option><option value="6">Poziom 6</option><option value="7">Poziom 7</option><option value="8">Poziom 8</option><option value="9">Poziom 9</option><option value="10">Poziom 10</option><option value="11">Poziom 11</option></select></div></div>
<main class="shell"><section class="sdk"><div class="sboard" id="board"></div><div class="pad" id="pad"></div><div class="under"><button class="btn" id="notesBtn" type="button">Notatki</button><button class="btn" id="undo">↶ Cofnij</button><button class="btn" id="check">Sprawdź</button></div><div class="status" id="status"></div></section></main>
<div class="modal" id="win" hidden><div class="modalbox"><h2>Gotowe ✨</h2><p>Plansza rozwiązana.</p><button class="btn primary" id="next">Nowa gra</button></div></div>
<script src="../js/app.js"></script><script>
const data={
"1":["005300000800000020070010500400005300010070006003200080060500009004000030000009700","145327698839654127672918543496185372218473956753296481367542819984761235521839764"],
"2":["000900002050123400030000160908000000070000090000000205091000050007439020400007000","814976532659123478732548169928354716175682394346791285291865347567439821483217956"],
"3":["000000012000000003002300400001800005060070080900004700005009600800000000470000000","743985612689241573152367498321896745564172389978534726215749638836425971497613852"],
"4":["100007090030020008009600500005300900010080002600004000300000010040000007007000300","162857493534129678789643521475312986913586742628794135356478219241935867897261354"],
"5":["000000010400000000020000000000050407008000300001090000300400200050100000000806000","693784512487512936125963874932651487568247391741398625319475268856129743274836159"],
"6":["000000000000003085001020000000507000004000100090000000500000073002010000000040009","987654321246173985351928746128537694674892153395461278519286473432719568763345219"],
"7":["005300000800000020070010500400005300010070006003200080060500009004000030000009700","145327698839654127672918543496185372218473956753296481367542819984761235521839764"],
"8":["100007090030020008009600500005300900010080002600004000300000010040000007007000300","162857493534129678789643521475312986913586742628794135356478219241935867897261354"],
"9":["300009020050040001002800700007500200030010004800006000500000030060000009009000500","384179625756342891912865743697534218235718964841926357578691432463257189129483576"],
"10":["500002040070060003004100900009700400050030006100008000700000050080000002002000700","516392847978564123234187965829756431457931286163248579791823654685479312342615798"],
"11":["700004060090080005006300200002900600070050008300001000900000070010000004004000900","738524169291786345456319287142978653679253418385461792923145876817692534564837921"]
};
const $=s=>document.querySelector(s);let level=localStorage.getItem("sudokuDifficulty")||"1",puzzle="",solution="",vals=[],selected=-1,hist=[],bad=new Set(),notesMode=false,notes={};
function transform(s,v){let out=Array(81);for(let r=0;r<9;r++)for(let c=0;c<9;c++){let rr=r,cc=c;if(v===1){rr=c;cc=r}if(v===2){rr=8-r;cc=8-c}if(v===3){rr=c;cc=8-r}let ch=s[rr*9+cc];out[r*9+c]=ch==="0"?"0":String((+ch+v-1)%9+1)}return out.join("")}
function fresh(){let v=Math.floor(Math.random()*4),d=data[level];puzzle=transform(d[0],v);solution=transform(d[1],v);vals=puzzle.split("");selected=-1;hist=[];bad.clear();notes={};localStorage.setItem("sudokuDifficulty",level);save();render()}
function save(){localStorage.setItem("sudokuState",JSON.stringify({level,puzzle,solution,vals,notes}))}
function render(){let b=$("#board");b.innerHTML="";for(let i=0;i<81;i++){let q=document.createElement("button"),v=vals[i],r=Math.floor(i/9),c=i%9;q.className="sq"+(puzzle[i]!=="0"?" given":"");if(selected>=0){let sr=Math.floor(selected/9),sc=selected%9;if(r===sr||c===sc||Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3))q.classList.add("peer");if(v!=="0"&&v===vals[selected])q.classList.add("same");if(i===selected)q.classList.add("sel")}if(bad.has(i))q.classList.add("bad");if(v!=="0")q.textContent=v;else if(notes[i]?.length){let w=document.createElement("span");w.className="candidates";for(let k=0;k<4;k++){let z=document.createElement("span");z.className="cand";z.textContent=notes[i][k]??"";w.append(z)}q.append(w)}q.onclick=()=>{selected=i;bad.clear();render()};b.append(q)}let counts={};vals.forEach(v=>counts[v]=(counts[v]||0)+1);document.querySelectorAll(".num[data-n]").forEach(x=>x.hidden=(counts[x.dataset.n]||0)>=9);$("#notesBtn").classList.toggle("active",notesMode)}
function setv(v){if(selected<0||puzzle[selected]!=="0")return;if(notesMode&&v!=="0"){let n=+v,a=notes[selected]||[];notes[selected]=a.includes(n)?a.filter(x=>x!==n):(a.length>=4?a:[...a,n].sort((a,b)=>a-b));if(!notes[selected].length)delete notes[selected];save();render();return}hist.push([selected,vals[selected],notes[selected]?[...notes[selected]]:null]);vals[selected]=v;delete notes[selected];bad.delete(selected);save();render();if(vals.join("")===solution)$("#win").hidden=false}
for(let n=1;n<=9;n++){let x=document.createElement("button");x.className="num";x.dataset.n=n;x.textContent=n;x.onclick=()=>setv(String(n));$("#pad").append(x)}let del=document.createElement("button");del.className="num";del.textContent="⌫";del.onclick=()=>setv("0");$("#pad").append(del);
$("#notesBtn").onclick=()=>{notesMode=!notesMode;render()};$("#undo").onclick=()=>{let h=hist.pop();if(h){vals[h[0]]=h[1];if(h[2])notes[h[0]]=h[2];else delete notes[h[0]];selected=h[0];save();render()}};$("#check").onclick=()=>{bad.clear();vals.forEach((v,i)=>{if(v!=="0"&&v!==solution[i]&&puzzle[i]==="0")bad.add(i)});$("#status").textContent=bad.size?`Do poprawy: ${bad.size}`:"Na razie wszystko pasuje.";render()};$("[data-new]").onclick=fresh;$("#next").onclick=()=>{$("#win").hidden=true;fresh()};if(!data[level]) level="1"; $("#level").value=level;$("#level").onchange=e=>{level=e.target.value;fresh()};
try{let s=JSON.parse(localStorage.getItem("sudokuState"));if(s&&s.level===level&&s.vals?.length===81){({puzzle,solution,vals}=s);notes=s.notes||{}}else fresh()}catch(e){fresh()}render();
document.querySelector("[data-options]").onclick=()=>{let o=$("#options");o.hidden=!o.hidden;document.querySelector("[data-options]").textContent=o.hidden?"Opcje ▾":"Opcje ▴"};</script></body></html>
