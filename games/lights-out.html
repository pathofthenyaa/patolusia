<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Lights Out</title><style>
.lights-panel{max-width:620px;margin:auto}
.lights-toolbar{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.lights-info{font-weight:800;color:var(--muted);white-space:nowrap}
.lights-board{width:min(100%,520px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:7px;padding:7px;box-sizing:border-box;border-radius:18px;background:rgba(127,127,127,.14);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.light{appearance:none;border:0;border-radius:12px;padding:0;min-width:0;min-height:0;width:100%;height:100%;background:rgba(127,127,127,.12);box-shadow:inset 0 0 0 1px rgba(127,127,127,.25);touch-action:manipulation;transition:transform .08s ease,background .12s ease,box-shadow .12s ease}
.light:active{transform:scale(.94)}
.light.on{background:#ffd84a;box-shadow:0 0 14px rgba(255,216,74,.65),inset 0 0 0 2px rgba(255,255,255,.35)}
.lights-win{display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px;margin:12px auto 0;padding:8px 12px;box-sizing:border-box;max-width:620px;font-weight:700;color:var(--muted)}
</style></head><body>
<header class="appbar"><div class="appbar-inner"><a class="back" href="../index.html">‹</a><div class="app-title">Lights Out</div><div class="spacer"></div><button class="btn" data-options>Opcje ▾</button><button class="btn" data-new>Nowa gra</button><button class="iconbtn" data-theme-button aria-label="Zmień motyw">◐</button></div></header>
<div class="game-options" id="options" hidden><div class="game-options-row"><label for="level">Poziom</label><select class="select" id="level"><option value="5">Łatwy</option><option value="9" selected>Standard</option><option value="14">Trudny</option></select></div></div>
<main class="shell"><section class="card panel lights-panel">
<div class="lights-toolbar"><span class="lights-info" id="moves">Ruchy: 0</span><span class="lights-info" id="left">Zapalone: 0</span></div>
<div class="lights-board" id="board" aria-label="Plansza Lights Out"></div>
</section>
<section class="card lights-win" id="message">Kliknij pole, aby przełączyć je oraz pola obok. Zgaś wszystkie światła.</section>
</main>
<script src="../js/app.js"></script><script>
const $=s=>document.querySelector(s),N=5;
let cells=Array(N*N).fill(false),moves=0,ended=false;

function affected(i){
 const r=Math.floor(i/N),c=i%N,a=[i];
 if(r>0)a.push(i-N);if(r<N-1)a.push(i+N);if(c>0)a.push(i-1);if(c<N-1)a.push(i+1);
 return a
}
function press(i,countMove=true){
 if(ended&&countMove)return;
 affected(i).forEach(j=>cells[j]=!cells[j]);
 if(countMove){
  moves++;
  if(cells.every(x=>!x)){ended=true;$("#message").textContent=`🎉 Zgaszone! Ruchy: ${moves}`}
 }
 render()
}
function reset(){
 const difficulty=+$("#level").value;
 cells=Array(N*N).fill(false);moves=0;ended=false;$("#message").textContent="Kliknij pole, aby przełączyć je oraz pola obok. Zgaś wszystkie światła.";
 const picks=[...Array(N*N).keys()];
 for(let i=picks.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[picks[i],picks[j]]=[picks[j],picks[i]]}
 picks.slice(0,difficulty).forEach(i=>press(i,false));
 // niezwykle rzadko legalne ruchy mogą się wzajemnie skasować do pustej planszy
 if(cells.every(x=>!x))press(picks[0],false);
 render()
}
function render(){
 const b=$("#board");b.innerHTML="";
 cells.forEach((on,i)=>{
  const q=document.createElement("button");q.type="button";q.className="light"+(on?" on":"");
  q.setAttribute("aria-label",on?"Zapalone pole":"Zgaszone pole");
  q.onclick=()=>press(i);b.append(q)
 });
 $("#moves").textContent=`Ruchy: ${moves}`;
 $("#left").textContent=`Zapalone: ${cells.filter(Boolean).length}`;
}
const optionsBtn=document.querySelector("[data-options]"),optionsPanel=$("#options");
optionsBtn.onclick=()=>{optionsPanel.hidden=!optionsPanel.hidden;optionsBtn.textContent=optionsPanel.hidden?"Opcje ▾":"Opcje ▴"};
document.querySelector("[data-new]").onclick=reset;
$("#level").onchange=reset;
reset();
</script></body></html>
