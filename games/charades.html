<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Kalambury</title><style>
.charades{max-width:680px;margin:auto}.setup h2{margin:2px 0 6px}.setup p{margin:0 0 16px}.category-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:16px}.cat{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--bg);font-weight:750;cursor:pointer;user-select:none}.cat input{position:absolute;opacity:0;pointer-events:none}.switch{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:.18s}.switch:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:white;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.18s}.cat input:checked+.switch{background:var(--accent)}.cat input:checked+.switch:after{transform:translateX(18px)}.round-settings{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 16px}.start{width:100%;min-height:52px}.game{display:none;text-align:center}.game.active{display:block}.setup.hidden{display:none}.roundtop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;font-weight:850}.timer{font-size:26px;font-variant-numeric:tabular-nums}.score{font-size:18px}.wordbox{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;border-radius:22px;background:var(--soft);margin-bottom:14px}.wordcat{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--accent);font-weight:850;margin-bottom:12px}.word{font-size:clamp(34px,10vw,58px);font-weight:900;line-height:1.05;letter-spacing:-1.5px;overflow-wrap:anywhere}.gameactions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gameactions .btn{min-height:58px;font-size:17px}.skip{color:var(--muted)}.result{display:none;text-align:center}.result.active{display:block}.result h2{font-size:34px;margin:4px 0 8px}.result-score{font-size:56px;font-weight:900;color:var(--accent);margin:8px 0 18px}.result .actions .btn{min-height:50px}.empty{color:var(--danger);font-weight:750;min-height:22px;margin:8px 0}.progress{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}.progress>div{height:100%;background:var(--accent);width:100%;transition:width 1s linear}@media(max-width:480px){.categories{grid-template-columns:1fr}.wordbox{min-height:220px}.category-actions .btn{flex:1;padding:0 9px;font-size:13px}}
</style></head><body>
<header class="appbar"><div class="appbar-inner"><a class="back" href="../index.html">‹</a><div class="app-title">Kalambury</div><div class="spacer"></div><button class="iconbtn" data-theme-button aria-label="Zmień motyw">◐</button></div></header>
<main class="shell"><section class="card panel charades">
<div class="setup" id="setup"><h2>Wybierz kategorie</h2><p class="muted">Hasła będą losowane tylko z zaznaczonych kategorii.</p><div class="category-actions"><button class="btn" id="all">Zaznacz wszystko</button><button class="btn" id="clear">Wyczyść wszystko</button><button class="btn" id="random">Zaznacz losowe</button></div><div class="categories" id="categories"></div><div class="round-settings"><label for="time" class="muted"><b>Czas rundy</b></label><select class="select" id="time"><option value="60">60 s</option><option value="90" selected>90 s</option><option value="120">120 s</option><option value="180">180 s</option></select></div><div class="empty" id="setupMessage"></div><button class="btn primary start" id="start">Graj</button></div>
<div class="game" id="game"><div class="roundtop"><span class="score" id="score">Punkty: 0</span><span class="timer" id="timer">1:30</span></div><div class="progress"><div id="progress"></div></div><div class="wordbox"><div class="wordcat" id="wordcat"></div><div class="word" id="word"></div></div><div class="gameactions"><button class="btn skip" id="skip">Pomiń</button><button class="btn primary" id="correct">Odgadnięte ✓</button></div></div>
<div class="result" id="result"><span class="eyebrow">Koniec rundy</span><h2>Wynik</h2><div class="result-score" id="resultScore">0</div><p class="muted" id="resultInfo"></p><div class="actions"><button class="btn" id="settings">Kategorie</button><button class="btn primary" id="again">Jeszcze raz</button></div></div>
</section></main><script src="../js/app.js"></script><script>
const DATA={
"Filmy i seriale":["Titanic","Harry Potter","Gwiezdne wojny","Król Lew","Shrek","Matrix","Avatar","Jumanji","Wednesday","Stranger Things","Toy Story","Kevin sam w domu","Piraci z Karaibów","Jurassic Park","Spider-Man","Batman","Terminator","Gladiator","Minionki","Scooby-Doo"],
"Postacie":["Sherlock Holmes","Kubuś Puchatek","Myszka Miki","Darth Vader","Superman","Hulk","Kopciuszek","Robin Hood","Dracula","Indiana Jones","James Bond","Pinokio","Tarzan","Król Artur","Święty Mikołaj","Czerwony Kapturek","Asterix","Obelix","Elsa","Wednesday Addams"],
"Zwierzęta":["pingwin","żyrafa","krokodyl","kangur","małpa","słoń","kot","pies","rekin","ośmiornica","wąż","koń","kura","paw","nietoperz","żaba","krab","bocian","chomik","wiewiórka"],
"Zawody":["strażak","lekarz","nauczyciel","kucharz","policjant","fryzjer","pilot","astronauta","fotograf","mechanik","dentysta","kelner","aktor","malarz","ogrodnik","listonosz","ratownik","sędzia","magik","detektyw"],
"Sport":["piłka nożna","koszykówka","siatkówka","tenis","boks","pływanie","narciarstwo","golf","kręgle","szachy","jazda konna","surfing","wspinaczka","hokej","łucznictwo","badminton","kajakarstwo","skok o tyczce","ping-pong","łyżwiarstwo"],
"Przedmioty":["parasol","młotek","szczoteczka do zębów","telefon","lodówka","odkurzacz","walizka","latarka","nożyczki","zegar","poduszka","drabina","klucz","lustro","czajnik","plecak","okulary","pilot do telewizora","świeca","spinacz"],
"Czynności":["kichanie","ziewanie","tańczenie","gotowanie","prasowanie","wędkowanie","bieganie","malowanie","spanie","mycie zębów","robienie selfie","pakowanie prezentu","granie na gitarze","wyprowadzanie psa","pompowanie balonu","jazda windą","otwieranie słoika","łapanie muchy","budowanie bałwana","szukanie kluczy"],
"Miejsca":["lotnisko","szpital","kino","plaża","zoo","biblioteka","restauracja","siłownia","szkoła","zamek","cyrk","stacja benzynowa","wesołe miasteczko","muzeum","piekarnia","basen","dworzec","las","bezludna wyspa","salon fryzjerski"],
"Jedzenie":["pizza","spaghetti","hamburger","lody","popcorn","naleśniki","sushi","rosół","kebab","arbuz","jajecznica","pierogi","hot dog","tort","frytki","pączek","kanapka","gofry","sałatka","czekolada"],
"Gry":["Minecraft","Tetris","Fortnite","The Sims","Super Mario","Pokémon","Wiedźmin","GTA","Pac-Man","Monopoly","Uno","Sudoku","Statki","Saper","Angry Birds","Among Us","Diablo","Cyberpunk 2077","God of War","Mario Kart"],
"Bajki i anime":["Dragon Ball","Naruto","Pokémon","Kraina Lodu","Psi Patrol","Smerfy","Tom i Jerry","Kaczor Donald","Pszczółka Maja","SpongeBob","Shrek","Epoka lodowcowa","Kung Fu Panda","Vaiana","Mulan","Aladyn","Gdzie jest Nemo","Lilo i Stich","Mój sąsiad Totoro","Czarodziejka z Księżyca"],
"Trudne":["wehikuł czasu","efekt domina","deja vu","grawitacja","teoria spiskowa","koniec świata","sztuczna inteligencja","podróż w czasie","czarna dziura","niewidzialność","wolna wola","przeznaczenie","globalne ocieplenie","burza mózgów","błędne koło","pierwsze wrażenie","szósty zmysł","strefa komfortu","kamień milowy","igła w stogu siana"]};
const $=s=>document.querySelector(s),cats=$("#categories");let pool=[],score=0,skipped=0,total=90,left=90,timer=null,current=null;
Object.keys(DATA).forEach((name,i)=>{const l=document.createElement("label");l.className="cat";l.innerHTML=`<input type="checkbox" value="${name}" ${i<6?"checked":""}><span class="switch"></span><span>${name}</span>`;cats.append(l)});
const checks=()=>[...cats.querySelectorAll("input")];
$("#all").onclick=()=>checks().forEach(x=>x.checked=true);$("#clear").onclick=()=>checks().forEach(x=>x.checked=false);
$("#random").onclick=()=>{const a=checks();a.forEach(x=>x.checked=false);const shuffled=[...a].sort(()=>Math.random()-.5),n=Math.floor(Math.random()*Math.min(5,a.length))+2;shuffled.slice(0,n).forEach(x=>x.checked=true)};
function buildPool(){pool=[];checks().filter(x=>x.checked).forEach(x=>DATA[x.value].forEach(word=>pool.push({word,cat:x.value})));for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}}
function next(){if(!pool.length){buildPool();if(!pool.length)return end()}current=pool.pop();$("#word").textContent=current.word;$("#wordcat").textContent=current.cat}
function start(){if(!checks().some(x=>x.checked)){$("#setupMessage").textContent="Wybierz przynajmniej jedną kategorię.";return}$("#setupMessage").textContent="";buildPool();score=0;skipped=0;total=left=+$("#time").value;$("#score").textContent="Punkty: 0";$("#setup").classList.add("hidden");$("#result").classList.remove("active");$("#game").classList.add("active");tick();next();clearInterval(timer);timer=setInterval(()=>{left--;tick();if(left<=0)end()},1000)}
function tick(){const m=Math.floor(left/60),s=String(left%60).padStart(2,"0");$("#timer").textContent=`${m}:${s}`;$("#progress").style.width=`${Math.max(0,left/total*100)}%`}
function end(){clearInterval(timer);timer=null;$("#game").classList.remove("active");$("#result").classList.add("active");$("#resultScore").textContent=score;$("#resultInfo").textContent=`Odgadnięte: ${score} · Pominięte: ${skipped}`}
$("#start").onclick=start;$("#correct").onclick=()=>{score++;$("#score").textContent=`Punkty: ${score}`;next()};$("#skip").onclick=()=>{skipped++;next()};$("#again").onclick=start;$("#settings").onclick=()=>{$("#result").classList.remove("active");$("#setup").classList.remove("hidden")};
</script></body></html>
