const $=s=>document.querySelector(s),cats=$("#categories");
const MODES={
 talk:{label:"Omawiane",categories:Object.keys(DATA)},
 gesture:{label:"Gesty",categories:["Zwierzęta","Zawody","Sport","Przedmioty","Czynności","Jedzenie"]}
};
let mode="talk",selections={talk:new Set(),gesture:new Set()},pool=[],score=0,skipped=0,total=90,left=90,timer=null,current=null;
MODES.talk.categories.slice(0,6).forEach(x=>selections.talk.add(x));MODES.gesture.categories.forEach(x=>selections.gesture.add(x));
function renderCategories(){cats.innerHTML="";MODES[mode].categories.forEach(name=>{const l=document.createElement("label");l.className="cat";l.innerHTML=`<input type="checkbox" value="${name}" ${selections[mode].has(name)?"checked":""}><span class="switch"></span><span>${name}</span>`;l.querySelector("input").onchange=e=>{e.target.checked?selections[mode].add(name):selections[mode].delete(name);updateSummary()};cats.append(l)});updateSummary()}
function updateSummary(){const n=selections[mode].size,total=MODES[mode].categories.length;$("#categorySummary").textContent=`Kategorie · ${n}/${total} wybranych`}
function setMode(next){mode=next;document.querySelectorAll(".modebtn").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));renderCategories();$("#setupMessage").textContent=""}
document.querySelectorAll(".modebtn").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
const checks=()=>[...cats.querySelectorAll("input")];
$("#all").onclick=()=>{selections[mode]=new Set(MODES[mode].categories);renderCategories()};
$("#clear").onclick=()=>{selections[mode].clear();renderCategories()};
$("#random").onclick=()=>{const a=[...MODES[mode].categories].sort(()=>Math.random()-.5),max=Math.min(5,a.length),n=Math.min(a.length,Math.floor(Math.random()*Math.max(1,max-1))+2);selections[mode]=new Set(a.slice(0,n));renderCategories()};
function buildPool(){pool=[];selections[mode].forEach(cat=>DATA[cat].forEach(word=>pool.push({word,cat})));for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}}
function next(){if(!pool.length){buildPool();if(!pool.length)return end()}current=pool.pop();$("#word").textContent=current.word;$("#wordcat").textContent=`${MODES[mode].label} · ${current.cat}`}
function start(){if(!selections[mode].size){$("#setupMessage").textContent="Wybierz przynajmniej jedną kategorię.";return}$("#setupMessage").textContent="";buildPool();score=0;skipped=0;total=left=+$("#time").value;$("#score").textContent="Punkty: 0";$("#setup").classList.add("hidden");$("#result").classList.remove("active");$("#game").classList.add("active");clearInterval(timer);timer=null;tick();next();if(total>0)timer=setInterval(()=>{left--;tick();if(left<=0)end()},1000)}
function tick(){if(total===0){$("#timer").textContent="∞";$("#progress").style.width="100%";return}const m=Math.floor(left/60),s=String(left%60).padStart(2,"0");$("#timer").textContent=`${m}:${s}`;$("#progress").style.width=`${Math.max(0,left/total*100)}%`}
function end(){clearInterval(timer);timer=null;$("#game").classList.remove("active");$("#result").classList.add("active");$("#resultScore").textContent=score;$("#resultInfo").textContent=`${MODES[mode].label} · Odgadnięte: ${score} · Pominięte: ${skipped}`}
$("#start").onclick=start;$("#correct").onclick=()=>{score++;$("#score").textContent=`Punkty: ${score}`;next()};$("#skip").onclick=()=>{skipped++;next()};$("#again").onclick=start;$("#settings").onclick=()=>{$("#result").classList.remove("active");$("#setup").classList.remove("hidden")};
renderCategories();
