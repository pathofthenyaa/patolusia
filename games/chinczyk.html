<!doctype html>
<html lang="pl" data-theme="auto"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6fb"><meta name="robots" content="noindex,nofollow,noarchive">
<link rel="stylesheet" href="../css/app.css"><title>Chińczyk</title>
<style>
.wrap{max-width:840px;margin:0 auto;padding:82px 14px 40px}.setup,.gamebox{padding:16px}.setup h1{margin:0 0 7px;font-size:26px}.muted2{opacity:.7;font-size:13px;line-height:1.45}.modepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.modepick .btn{min-height:72px;font-size:18px}.connectgrid{display:block;margin-top:12px}.connectgrid .pane{display:none}.connectgrid .pane.active{display:block}.backmode{margin-bottom:10px}.pane{padding:13px;border-radius:16px;background:color-mix(in srgb,currentColor 5%,transparent)}.pane h2{margin:0 0 5px;font-size:18px}.controls{display:grid;gap:8px;margin-top:10px}.btnwide{width:100%;min-height:46px}.codeinput{width:100%;height:50px;box-sizing:border-box;text-align:center;font-size:24px;font-weight:850;letter-spacing:.2em;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text)}.roomcode{text-align:center;font-size:40px;font-weight:900;letter-spacing:.15em}.status{margin-top:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,currentColor 6%,transparent);font-weight:750}.connsummary{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:800}.connsummary .dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}.connsummary .grow{flex:1}.connsummary small{font-weight:650;opacity:.65}.setup.connected{padding:10px}.setup.connected>h1,.setup.connected>.intro,.setup.connected>.modepick,.setup.connected>.connectgrid,.setup.connected>.status,.setup.connected>.lobby{display:none}.setup.connected .connsummary{display:flex!important}
.lobby{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:16px}.lobbyhead{display:flex;align-items:center;gap:8px}.lobbyhead strong{flex:1}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.playerchip{padding:8px 5px;text-align:center;border-radius:12px;background:color-mix(in srgb,currentColor 6%,transparent);font-size:12px;font-weight:800}.playerchip.off{opacity:.35}.playerchip .pnum{font-size:20px;display:block}
.topgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}.dicebox,.mypieces{border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,currentColor 3%,transparent);padding:9px}.dicebox{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:7px;min-width:0}.dieplayer{height:34px;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 7px;border-radius:10px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 7%,var(--card));box-sizing:border-box}.dieplayer.red{color:#d93636}.dieplayer.blue{color:#276bd1}.dieplayer.green{color:#239b56}.dieplayer.yellow{color:#d5a900}.dieplayer.inactive{opacity:.24}.dieplayer.active{box-shadow:inset 0 0 0 1px currentColor}.dieplayer .label{display:block;width:9px;height:9px;min-width:9px;border-radius:50%;font-size:0;background:currentColor}.dieplayer .value{margin-left:0;font-size:19px;line-height:1;font-weight:950;color:currentColor}@media(max-width:430px){.dicebox{gap:3px;padding:6px}.dieplayer{height:32px;padding:0 5px}.dieplayer .label{width:8px;height:8px;min-width:8px}.dieplayer .value{font-size:17px}}
.boardwrap{margin-top:10px}.board{position:relative;aspect-ratio:1;max-width:620px;margin:0 auto;border-radius:22px;background:var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:0 8px 28px color-mix(in srgb,#000 10%,transparent)}
.cell,.lane{position:absolute;width:7.15%;aspect-ratio:1;border-radius:22%;transform:translate(-50%,-50%);display:grid;place-items:center;font-weight:900;z-index:3;box-sizing:border-box}.cell{border:1px solid color-mix(in srgb,currentColor 20%,transparent);background:var(--card);box-shadow:0 1px 4px color-mix(in srgb,#000 8%,transparent)}.cell[class*="start-"]{background:var(--card);border:1px solid var(--line);box-shadow:inset 0 0 0 2px color-mix(in srgb,currentColor 45%,transparent)}.cell[class*="start-"]::after{content:"";position:absolute;width:22%;aspect-ratio:1;border-radius:50%;right:8%;top:8%;background:currentColor}.cell.start-red{color:#d93636}.cell.start-blue{color:#276bd1}.cell.start-green{color:#239b56}.cell.start-yellow{color:#d5a900}.lane.red{background:#d9363630;border:2px solid #d93636aa}.lane.blue{background:#276bd130;border:2px solid #276bd1aa}.lane.green{background:#239b5630;border:2px solid #239b56aa}.lane.yellow{background:#d5a90030;border:2px solid #d5a900aa}
.base{position:absolute;width:23%;height:23%;border-radius:18%;box-sizing:border-box;z-index:1}.base.red{left:3%;top:3%;background:#d936361c;border:2px solid #d9363655}.base.blue{right:3%;top:3%;background:#276bd11c;border:2px solid #276bd155}.base.green{right:3%;bottom:3%;background:#239b561c;border:2px solid #239b5655}.base.yellow{left:3%;bottom:3%;background:#d5a9001c;border:2px solid #d5a90055}.base.inactive{opacity:.18;filter:grayscale(1)}.basehole{position:absolute;width:34%;height:34%;min-width:0;min-height:0;border-radius:50%;background:var(--card);display:block;border:1px solid var(--line);box-sizing:border-box}.basehole:nth-child(1){left:10%;top:10%}.basehole:nth-child(2){right:10%;top:10%}.basehole:nth-child(3){left:10%;bottom:10%}.basehole:nth-child(4){right:10%;bottom:10%}.basehole>.pawn{position:absolute;left:50%;top:50%;width:72%;height:72%;aspect-ratio:auto;transform:translate(-50%,-50%)}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:7%;aspect-ratio:1;border-radius:12%;background:conic-gradient(from -45deg,#d9363655 0 25%,#276bd155 0 50%,#239b5655 0 75%,#d5a90055 0);border:1px solid var(--line);z-index:1}
.pawn{width:72%;height:auto;aspect-ratio:1/1;flex:none;border-radius:50%;display:grid;place-items:center;box-sizing:border-box;font-size:clamp(10px,2.5vw,16px);font-weight:950;line-height:1;color:#fff;text-shadow:0 1px 2px #0008;border:2px solid #fff9;box-shadow:0 2px 6px #0005;user-select:none;touch-action:manipulation}.pawn.red{background:#d93636}.pawn.blue{background:#276bd1}.pawn.green{background:#239b56}.pawn.yellow{background:#d5a900;color:#302800;text-shadow:none}.pawn.mine.legal{cursor:pointer;outline:3px solid #fff;box-shadow:0 0 0 4px #ffffff55,0 2px 8px #0006;animation:pulse 1.1s ease-in-out infinite alternate}.cell>.pawn,.lane>.pawn{position:absolute;width:86%;z-index:6}.cell>.pawn:nth-child(2),.lane>.pawn:nth-child(2){transform:translate(22%,22%);width:68%}.cell>.pawn:nth-child(3),.lane>.pawn:nth-child(3){transform:translate(-22%,22%);width:68%}.cell>.pawn:nth-child(4),.lane>.pawn:nth-child(4){transform:translate(0,-24%);width:62%}@keyframes pulse{to{filter:brightness(1.16);scale:1.06}}
.mypieces{margin-top:8px;padding:9px 10px}.pieces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:0}.piecebtn{min-height:58px;border-radius:15px;border:2px solid transparent;font-size:18px;font-weight:850;background:color-mix(in srgb,currentColor 7%,transparent);display:grid;place-items:center;gap:1px}.piecebtn.red{color:#d93636}.piecebtn.blue{color:#276bd1}.piecebtn.green{color:#239b56}.piecebtn.yellow{color:#b18d00}.piecebtn.legal{border-color:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 14%,transparent)}.piecebtn:disabled{opacity:.5}.piecebtn .ps{font-size:10px;opacity:.72}.actions{display:grid;grid-template-columns:1.35fr .65fr;gap:9px;margin-top:10px}.ok{color:var(--ok)}.bad{color:var(--danger)}
@media(max-width:620px){.modepick{grid-template-columns:1fr}.connectgrid.wrap{padding-top:76px}.cell,.lane{width:7.5%}.board{border-radius:20px}.players{grid-template-columns:repeat(2,1fr)}.dicebox{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:3px;padding:5px}.dieplayer{min-width:0;height:30px;padding:0 5px}.pieces{gap:6px}.piecebtn{min-height:54px;padding:5px}.actions{grid-template-columns:1fr}.setup{padding:14px}}
</style></head><body>
<header class="appbar"><div class="appbar-inner"><a class="back" href="../index.html" aria-label="Wróć">‹</a><div class="app-title">Chińczyk</div><div class="spacer"></div><button class="iconbtn" data-theme-button aria-label="Zmień motyw">◐</button></div></header>
<main class="wrap">
<section class="card setup" id="setup"><h1>🎲 Chińczyk — 2–4 graczy</h1><div class="muted2 intro">Jeden kod pokoju. Host rozpoczyna grę, gdy są co najmniej 2 osoby. Każdy telefon steruje własnym kolorem.</div>
<button class="connsummary" id="connSummary" hidden><span class="dot"></span><span class="grow" id="connText">Nie połączono</span><small>Połączenie ▾</small></button>
<div class="modepick" id="modePick"><button class="btn primary" id="pickCreate">＋ Utwórz pokój</button><button class="btn" id="pickJoin">↪ Dołącz do pokoju</button></div><div class="connectgrid" id="connectGrid"><div class="pane" id="createPane"><h2>Pokój utworzony</h2><div class="muted2">Podaj ten kod pozostałym graczom.</div><div class="controls"><div id="room" hidden><div class="muted2" style="text-align:center">Kod pokoju</div><div class="roomcode" id="roomCode">----</div></div></div></div>
<div class="pane" id="joinPane"><button class="btn backmode" data-backmode>‹ Wróć</button><h2>Dołącz</h2><div class="muted2">Pozostali wpisują ten sam kod.</div><div class="controls"><input class="codeinput" id="joinCode" inputmode="numeric" maxlength="4" placeholder="0000"><button class="btn primary btnwide" id="join">Dołącz</button></div></div></div>
<div class="lobby" id="lobby" hidden><div class="lobbyhead"><strong>Lobby</strong><span class="muted2" id="lobbyCount">1/4</span></div><div class="players" id="players"></div><button class="btn primary btnwide" id="startGame" disabled>Rozpocznij grę</button></div>
<div class="status" id="status">Nie połączono</div></section>
<section class="card gamebox" id="game" hidden>
<div class="topgrid"><div class="dicebox" id="dicebox"></div></div>
<div class="boardwrap"><div class="board" id="board"><div class="base red" id="redBase"></div><div class="base blue" id="blueBase"></div><div class="base green" id="greenBase"></div><div class="base yellow" id="yellowBase"></div><div class="center"></div></div></div>
<div class="mypieces"><div class="pieces" id="myPieces"></div></div>
<div class="actions"><button class="btn primary btnwide" id="roll">Rzuć kostką</button><button class="btn btnwide" id="newGame">Nowa partia</button></div></section>
</main><script src="../js/app.js"></script><script>
const SIGNAL='https://patolusia.margoth.workers.dev', COLORS=['red','blue','green','yellow'], ICON={red:'🔴',blue:'🔵',green:'🟢',yellow:'🟡'}, NAME={red:'Czerwony',blue:'Niebieski',green:'Zielony',yellow:'Żółty'}, START={red:0,blue:10,green:20,yellow:30};
const $=id=>document.getElementById(id);let isHost=false,myColor=null,roomCode='',guestId='',guestPoll=null,hostPoll=null,state=null,started=false;let ch=null,pc=null;const peers=new Map();
function setStatus(t,k=''){$('status').textContent=t;$('status').className='status '+k}
async function api(path,opt={}){const r=await fetch(SIGNAL+path,{cache:'no-store',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok||d.ok===false){let e=new Error(d.error||'HTTP '+r.status);e.code=d.error;throw e}return d}
function waitIce(p){return new Promise(res=>{if(p.iceGatheringState==='complete')return res();let f=()=>{if(p.iceGatheringState==='complete'){p.removeEventListener('icegatheringstatechange',f);res()}};p.addEventListener('icegatheringstatechange',f);setTimeout(res,6000)})}
function lobbyUI(count=1){$('lobby').hidden=false;$('lobbyCount').textContent=count+'/4';let box=$('players');box.innerHTML='';for(let i=0;i<4;i++){let d=document.createElement('div');d.className='playerchip'+(i<count?'':' off');d.innerHTML=`<span class="pnum">${ICON[COLORS[i]]}</span>Gracz ${i+1}`;box.appendChild(d)}$('startGame').hidden=!isHost;$('startGame').disabled=!isHost||count<2}
function connectedSummary(){ $('connText').textContent=`Połączono · Pokój ${roomCode}`;$('connSummary').hidden=false }
function collapseSetup(){connectedSummary();$('setup').classList.add('connected')}
function fresh(active){let pieces={},lastRolls={};active.forEach(c=>{pieces[c]=[-1,-1,-1,-1];lastRolls[c]=null});return{players:active,turn:active[0],roll:null,lastRolls,awaitingMove:false,winner:null,pieces,seq:0}}
function nextColor(c){let a=state.players,i=a.indexOf(c);return a[(i+1)%a.length]}
function sendGuest(m){if(ch&&ch.readyState==='open')ch.send(JSON.stringify(m))}
function sendTo(gid,m){let p=peers.get(gid);if(p?.ch?.readyState==='open')p.ch.send(JSON.stringify(m))}
function broadcast(){if(!isHost||!state)return;state.seq++;for(const [gid] of peers)sendTo(gid,{type:'state',state});render()}
function hostHandle(gid,color,m){if(m.type==='hello')sendTo(gid,{type:'lobby',started,playerCount:connectedPlayers()});else if(m.type==='roll')hostRoll(color);else if(m.type==='move')hostMove(color,m.index);else if(m.type==='new'){state=fresh(state.players);broadcast()}}
function guestHandle(m){if(m.type==='state'){state=m.state;started=true;collapseSetup();$('game').hidden=false;render()}else if(m.type==='lobby'){lobbyUI(m.playerCount)}}
function connectedPlayers(){return 1+[...peers.values()].filter(p=>p.ch?.readyState==='open').length}
function wireHost(gid,color,c){let p=peers.get(gid);if(!p)return;p.ch=c;c.onopen=()=>{setStatus('Gracz dołączył ✓','ok');lobbyUI(connectedPlayers());sendTo(gid,{type:'lobby',started,playerCount:connectedPlayers()})};c.onmessage=e=>{try{hostHandle(gid,color,JSON.parse(e.data))}catch{}};c.onclose=()=>{lobbyUI(connectedPlayers())}}
function wireGuest(c){ch=c;c.onopen=()=>{setStatus('Połączono ✓','ok');connectedSummary();sendGuest({type:'hello'})};c.onmessage=e=>{try{guestHandle(JSON.parse(e.data))}catch{}};c.onclose=()=>resetUI()}
async function hostSync(){if(!isHost||!roomCode)return;try{let s=await api('/v2/status?code='+roomCode);lobbyUI(connectedPlayers());for(const g of s.guests){if(!peers.has(g.guestId)){let color=COLORS[g.playerNumber-1],p=new RTCPeerConnection({iceServers:[]}),c=p.createDataChannel('chinczyk');peers.set(g.guestId,{pc:p,ch:c,color,answered:false});wireHost(g.guestId,color,c);await p.setLocalDescription(await p.createOffer());await waitIce(p);await api('/v2/offer',{method:'POST',body:JSON.stringify({code:roomCode,guestId:g.guestId,offer:p.localDescription})})}let local=peers.get(g.guestId);if(g.answer&&!local.answered){await local.pc.setRemoteDescription(g.answer);local.answered=true}}}catch{}}
async function guestSync(){if(isHost||!roomCode||!guestId||pc)return;try{let d=await api(`/v2/offer?code=${roomCode}&guestId=${encodeURIComponent(guestId)}`);if(!d.offer)return;pc=new RTCPeerConnection({iceServers:[]});pc.ondatachannel=e=>wireGuest(e.channel);await pc.setRemoteDescription(d.offer);await pc.setLocalDescription(await pc.createAnswer());await waitIce(pc);await api('/v2/answer',{method:'POST',body:JSON.stringify({code:roomCode,guestId,answer:pc.localDescription})});setStatus('Łączenie…')}catch{}}
function legal(color,i,roll){let p=state.pieces[color][i];if(p===44)return false;if(p===-1)return roll===6;return p+roll<=44}
function legalList(color){if(!state||!state.roll)return[];return state.pieces[color].map((_,i)=>legal(color,i,state.roll)?i:-1).filter(i=>i>=0)}
function hostRoll(color){if(!isHost||state.winner||state.turn!==color||state.awaitingMove)return;state.roll=1+Math.floor(Math.random()*6);state.lastRolls[color]=state.roll;let ls=legalList(color);if(ls.length)state.awaitingMove=true;else{let six=state.roll===6;state.roll=null;if(!six)state.turn=nextColor(color)}broadcast()}
function hostMove(color,i){if(!isHost||state.turn!==color||!state.awaitingMove||!legal(color,i,state.roll))return;let roll=state.roll,p=state.pieces[color][i],np=p===-1?0:p+roll;state.pieces[color][i]=np;if(np<40){let abs=(START[color]+np)%40;for(const other of state.players)if(other!==color)state.pieces[other]=state.pieces[other].map(op=>op>=0&&op<40&&((START[other]+op)%40)===abs?-1:op)}state.awaitingMove=false;state.roll=null;if(state.pieces[color].filter(x=>x===44).length===4)state.winner=color;else if(roll!==6)state.turn=nextColor(color);broadcast()}
function requestRoll(){if(!state||state.winner||state.turn!==myColor||state.awaitingMove)return;if(isHost)hostRoll(myColor);else sendGuest({type:'roll'})}
function requestMove(i){if(!state||state.turn!==myColor||!state.awaitingMove)return;if(isHost)hostMove(myColor,i);else sendGuest({type:'move',index:i})}
function pos(el,x,y){el.style.left=x+'%';el.style.top=y+'%'}
function drawBoard(){const b=$('board');const route=[[4,0],[5,0],[6,0],[6,1],[6,2],[6,3],[6,4],[7,4],[8,4],[9,4],[10,4],[10,5],[10,6],[9,6],[8,6],[7,6],[6,6],[6,7],[6,8],[6,9],[6,10],[5,10],[4,10],[4,9],[4,8],[4,7],[4,6],[3,6],[2,6],[1,6],[0,6],[0,5],[0,4],[1,4],[2,4],[3,4],[4,4],[4,3],[4,2],[4,1]];const maxX=10,maxY=10;const P=(n,max)=>4.5+n*(91/max);
route.forEach((q,i)=>{let d=document.createElement('div'),sc=COLORS.find(c=>START[c]===i);d.className='cell'+(sc?' start-'+sc:'');pos(d,P(q[0],maxX),P(q[1],maxY));d.dataset.cell=i;b.appendChild(d)});
const lanes={red:[[5,1],[5,2],[5,3],[5,4]],blue:[[9,5],[8,5],[7,5],[6,5]],green:[[5,9],[5,8],[5,7],[5,6]],yellow:[[1,5],[2,5],[3,5],[4,5]]};
for(const c of COLORS)for(let j=0;j<4;j++){let d=document.createElement('div');d.className='lane '+c;pos(d,P(lanes[c][j][0],maxX),P(lanes[c][j][1],maxY));d.dataset.lane=c+'-'+(40+j);b.appendChild(d)}
for(const c of COLORS){let base=$(c+'Base');for(let i=0;i<4;i++){let h=document.createElement('div');h.className='basehole';h.dataset.base=c+'-'+i;base.appendChild(h)}}}
function statusOf(p){return p===-1?'Baza':p===44?'Dom':p<40?'Plansza':`Dom ${p-39}/4`}
function renderBoard(){document.querySelectorAll('.cell,.lane,.basehole').forEach(c=>c.replaceChildren());for(const color of state.players)state.pieces[color].forEach((p,i)=>{let target;if(p===-1)target=document.querySelector(`[data-base="${color}-${i}"]`);else if(p<40)target=document.querySelector(`.cell[data-cell="${(START[color]+p)%40}"]`);else if(p<44)target=document.querySelector(`[data-lane="${color}-${p}"]`);if(!target)return;let pawn=document.createElement('div'),can=color===myColor&&state.turn===myColor&&state.awaitingMove&&legal(myColor,i,state.roll);pawn.className=`pawn ${color}${color===myColor?' mine':''}${can?' legal':''}`;pawn.textContent=i+1;if(can)pawn.onclick=e=>{e.stopPropagation();requestMove(i)};target.appendChild(pawn)})}
function render(){if(!state)return;COLORS.forEach(c=>$(c+'Base').classList.toggle('inactive',!state.players.includes(c)));let mine=state.pieces[myColor];$('dicebox').innerHTML='';for(const c of COLORS){let d=document.createElement('div');d.className='dieplayer '+c+' '+(!state.players.includes(c)?'inactive ':'')+(state.turn===c?'active':'');d.innerHTML=`<div class="label">${ICON[c]} ${NAME[c]}</div><div class="value">${state.lastRolls[c]??'–'}</div>`;$('dicebox').appendChild(d)}
 const myTurn=state.turn===myColor;
 const moving=state.awaitingMove;
 let rollLabel='';
 if(state.winner){
   rollLabel=state.winner===myColor?'Wygrywasz! 🎉':`${ICON[state.winner]} ${NAME[state.winner]} wygrywa`;
 }else if(myTurn && moving){
   rollLabel=`🎲 ${state.roll} — wybierz pionek`;
 }else if(myTurn){
   rollLabel='Twoja kolej — rzuć kostką';
 }else if(moving){
   rollLabel=`${ICON[state.turn]} ${NAME[state.turn]} wybiera pionek`;
 }else{
   rollLabel=`Tura: ${ICON[state.turn]} ${NAME[state.turn]}`;
 }
 $('roll').textContent=rollLabel;
 $('roll').disabled=!!state.winner||state.turn!==myColor||state.awaitingMove;renderBoard();let box=$('myPieces');box.innerHTML='';mine.forEach((p,i)=>{let bt=document.createElement('button'),can=state.turn===myColor&&state.awaitingMove&&legal(myColor,i,state.roll);bt.className='piecebtn '+myColor+(can?' legal':'');bt.innerHTML=`<span>${ICON[myColor]} ${i+1}</span><span class="ps">${statusOf(p)}</span>`;bt.disabled=!can;bt.onclick=()=>requestMove(i);box.appendChild(bt)})}
function resetUI(){backMode();if(guestPoll)clearInterval(guestPoll);if(hostPoll)clearInterval(hostPoll);guestPoll=hostPoll=null;$('setup').classList.remove('connected');$('connSummary').hidden=true;$('connText').textContent='Nie połączono';$('room').hidden=true;$('lobby').hidden=true;$('game').hidden=true;setStatus('Nie połączono');state=null;started=false}
$('connSummary').onclick=()=>{$('setup').classList.toggle('connected')};
function chooseMode(mode){$('modePick').hidden=true;$('createPane').classList.toggle('active',mode==='create');$('joinPane').classList.toggle('active',mode==='join')}
function backMode(){$('modePick').hidden=false;$('createPane').classList.remove('active');$('joinPane').classList.remove('active')}
$('pickCreate').onclick=()=>createRoom();$('pickJoin').onclick=()=>chooseMode('join');document.querySelectorAll('[data-backmode]').forEach(b=>b.onclick=backMode);

async function createRoom(){try{
 resetUI();isHost=true;myColor='red';$('modePick').hidden=true;$('joinPane').classList.remove('active');$('createPane').classList.add('active');setStatus('Tworzę pokój…');
 let d=await api('/v2/create',{method:'POST',body:'{}'});roomCode=String(d.code);$('roomCode').textContent=roomCode;$('room').hidden=false;$('lobby').hidden=false;lobbyUI(1);setStatus('Pokój '+roomCode+' — czekam na graczy');hostPoll=setInterval(hostSync,700)
}catch{backMode();setStatus('Błąd tworzenia pokoju','bad')}}
$('joinCode').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);
$('join').onclick=async()=>{let code=$('joinCode').value;if(!/^\d{4}$/.test(code))return setStatus('Wpisz 4 cyfry','bad');try{resetUI();isHost=false;roomCode=code;setStatus('Dołączam…');let d=await api('/v2/join',{method:'POST',body:JSON.stringify({code})});guestId=d.guestId;myColor=COLORS[d.playerNumber-1];$('lobby').hidden=false;lobbyUI(d.playerNumber);setStatus(`${ICON[myColor]} Dołączono do lobby — czekam na hosta`);guestPoll=setInterval(guestSync,600)}catch(e){setStatus(e.code==='ROOM_FULL'?'Pokój jest pełny':e.code==='GAME_ALREADY_STARTED'?'Gra już się rozpoczęła':'Nie znaleziono pokoju','bad')}};
$('startGame').onclick=async()=>{if(!isHost||connectedPlayers()<2)return;try{await api('/v2/start',{method:'POST',body:JSON.stringify({code:roomCode})});started=true;let active=['red',...[...peers.values()].filter(p=>p.ch?.readyState==='open').sort((a,b)=>COLORS.indexOf(a.color)-COLORS.indexOf(b.color)).map(p=>p.color)];state=fresh(active);collapseSetup();$('game').hidden=false;broadcast()}catch{setStatus('Nie udało się rozpocząć gry','bad')}};
$('roll').onclick=requestRoll;$('newGame').onclick=()=>{if(!state)return;if(isHost){state=fresh(state.players);broadcast()}else sendGuest({type:'new'})};
window.addEventListener('pagehide',()=>{if(guestPoll)clearInterval(guestPoll);if(hostPoll)clearInterval(hostPoll);try{ch?.close();pc?.close()}catch{}for(const p of peers.values())try{p.ch?.close();p.pc?.close()}catch{}});
window.addEventListener('pageshow',()=>{if(!started)resetUI()});drawBoard();
</script></body></html>
