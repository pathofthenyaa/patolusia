<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6fb"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Statki</title><style>
.sea{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1;gap:2px;background:var(--line);padding:2px;border-radius:16px;overflow:hidden;touch-action:manipulation}.cell{border:0;padding:0;background:var(--card);min-width:0}.cell.ship{background:#aeb8cc}.cell.hit{background:#e95d5d}.cell.miss{background:#9cc8e8}.cell.sunk{background:#9f3442}.legend{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}.fleet{display:flex;gap:5px;justify-content:center;margin:10px 0;flex-wrap:wrap}.shiptag{padding:5px 8px;border-radius:999px;background:var(--soft);font-size:12px}.boards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.boards h3{text-align:center;margin:0 0 8px}@media(max-width:620px){.boards{grid-template-columns:1fr}.enemyWrap{order:-1}}
</style></head><body><main class="shell"><header class="top"><a class="back" href="../index.html">‹</a><div class="brand">Statki</div><div class="spacer"></div><button class="btn" id="new">Nowa gra</button><button class="iconbtn" data-theme-button>◐</button></header>
<section class="card panel"><div class="toolbar"><button class="btn primary" id="place">Losuj flotę</button><button class="btn" id="start">Start</button><span class="muted" id="phase">Ustaw flotę i rozpocznij.</span></div><div class="fleet" id="fleet"></div>
<div class="boards"><div><h3>Twoja flota</h3><div class="sea" id="player"></div></div><div class="enemyWrap"><h3>Przeciwnik</h3><div class="sea" id="enemy"></div></div></div><div class="status" id="status"></div></section></main>
<div class="modal" id="modal" hidden><div class="modalbox"><h2 id="result"></h2><p id="resultText"></p><button class="btn primary" id="again">Jeszcze raz</button></div></div>
<script src="../js/app.js"></script><script>
const sizes=[4,3,3,2,2,2,1,1,1,1], P=Array(100).fill(0), E=Array(100).fill(0), pShots=new Set(), eShots=new Set();let active=false,lock=false,targetQueue=[];
const $=s=>document.querySelector(s), player=$("#player"),enemy=$("#enemy"),status=$("#status"),phase=$("#phase");
function around(i){let r=Math.floor(i/10),c=i%10,a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let rr=r+dr,cc=c+dc;if(rr>=0&&rr<10&&cc>=0&&cc<10)a.push(rr*10+cc)}return a}
function placeFleet(a){a.fill(0);let id=1;for(const len of sizes){let ok=false;while(!ok){let h=Math.random()<.5,r=Math.floor(Math.random()*(h?10:11-len)),c=Math.floor(Math.random()*(h?11-len:10));let cells=Array.from({length:len},(_,k)=>(r+(h?0:k))*10+c+(h?k:0));if(cells.every(i=>around(i).every(j=>!a[j]))){cells.forEach(i=>a[i]=id);ok=true;id++}}}}
function render(){player.innerHTML=enemy.innerHTML="";for(let i=0;i<100;i++){let b=document.createElement("button");b.className="cell"+(P[i]?" ship":"")+(eShots.has(i)?(P[i]?" hit":" miss"):"");b.disabled=true;player.append(b);let e=document.createElement("button");e.className="cell"+(pShots.has(i)?(E[i]?" hit":" miss"):"");e.dataset.i=i;e.disabled=!active||lock||pShots.has(i);e.addEventListener("click",fire);enemy.append(e)}}
function remaining(a,shots){return new Set(a.filter((v,i)=>v&&!shots.has(i))).size}
function sunkAll(a,shots){return a.every((v,i)=>!v||shots.has(i))}
function fire(ev){if(!active||lock)return;let i=+ev.currentTarget.dataset.i;pShots.add(i);status.textContent=E[i]?"Trafiony!":"Pudło.";render();if(sunkAll(E,pShots))return end(true);lock=true;setTimeout(aiTurn,380)}
function aiTurn(){let choices=targetQueue.filter(i=>!eShots.has(i));let i;if(choices.length)i=choices[Math.floor(Math.random()*choices.length)];else{let free=Array.from({length:100},(_,i)=>i).filter(i=>!eShots.has(i));i=free[Math.floor(Math.random()*free.length)]}eShots.add(i);if(P[i]){let r=Math.floor(i/10),c=i%10;[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc])=>{if(rr>=0&&rr<10&&cc>=0&&cc<10&&!eShots.has(rr*10+cc))targetQueue.push(rr*10+cc)});status.textContent="Komputer trafił."}else status.textContent="Komputer spudłował.";targetQueue=targetQueue.filter(x=>!eShots.has(x));lock=false;render();if(sunkAll(P,eShots))end(false)}
function end(win){active=false;render();$("#result").textContent=win?"Wygrana! ⚓":"Flota zatopiona";$("#resultText").textContent=win?"Morze należy do Ciebie.":"Komputer tym razem był szybszy.";$("#modal").hidden=false}
function reset(){pShots.clear();eShots.clear();targetQueue=[];active=false;lock=false;placeFleet(P);placeFleet(E);phase.textContent="Ustaw flotę i rozpocznij.";status.textContent="";$("#modal").hidden=true;render()}
$("#place").onclick=()=>{if(!active){placeFleet(P);render()}};$("#start").onclick=()=>{active=true;phase.textContent="Bitwa trwa.";render()};$("#new").onclick=reset;$("#again").onclick=reset;reset();
</script></body></html>
