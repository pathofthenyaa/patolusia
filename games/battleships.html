<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Statki</title><style>
.boards{display:flex;flex-direction:column;gap:18px;width:min(100%,540px);margin:auto}.sea{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1;gap:2px;background:var(--line);padding:2px;border-radius:16px;overflow:hidden;touch-action:manipulation}.cell{border:0;padding:0;background:var(--card)}.cell.ship{background:#aeb8cc}.cell.preview{background:var(--accent)}.cell.hit{background:#e95d5d}.cell.miss{background:#9cc8e8}.cell.sunk{background:#8f3140}.boards h3{text-align:center;margin:0 0 8px}.fleet{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}.shiptag{border:0;border-radius:999px;padding:7px 10px;background:var(--soft);font-weight:750}.shiptag.active{outline:2px solid var(--accent)}.setup{width:min(100%,540px);margin:0 auto 14px}.enemyWrap[hidden]{display:none}
</style></head><body><header class="appbar"><div class="appbar-inner"><a class="back" href="../index.html">‹</a><div class="app-title">Statki</div><div class="spacer"></div><button class="iconbtn" data-theme-button>◐</button></div></header>
<main class="shell"><section class="setup card panel"><div class="toolbar"><button class="btn" id="rotate">↻ Poziomo</button><button class="btn" id="random">Losuj</button><button class="btn primary" id="start">Start</button><button class="btn danger" id="new">Nowa gra</button></div><div class="fleet" id="fleet"></div><div class="status" id="status">Wybierz statek i dotknij planszy.</div></section>
<section class="boards"><div><h3>Twoja flota</h3><div class="sea" id="player"></div></div><div class="enemyWrap" id="enemyWrap" hidden><h3>Przeciwnik</h3><div class="sea" id="enemy"></div></div></section></main>
<div class="modal" id="modal" hidden><div class="modalbox"><h2 id="result"></h2><p id="resultText"></p><button class="btn primary" id="again">Jeszcze raz</button></div></div>
<script src="../js/app.js"></script><script>
const fleetSizes=[4,3,3,2,2,2,1,1,1,1],P=Array(100).fill(0),E=Array(100).fill(0);let placed=Array(10).fill(false),sel=0,horiz=true,active=false,lock=false,pShots=new Set,eShots=new Set,target=[];
const $=s=>document.querySelector(s),status=$("#status");
function cellsFor(start,len){let r=Math.floor(start/10),c=start%10;if(horiz&&c+len>10||!horiz&&r+len>10)return null;return Array.from({length:len},(_,k)=>start+(horiz?k:k*10))}
function halo(cells){let s=new Set;cells.forEach(i=>{let r=Math.floor(i/10),c=i%10;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let rr=r+dr,cc=c+dc;if(rr>=0&&rr<10&&cc>=0&&cc<10)s.add(rr*10+cc)}});return s}
function canPlace(cells,id){return cells&&[...halo(cells)].every(i=>!P[i]||P[i]===id+1)}
function placeAt(i){if(active||placed[sel])return;let cells=cellsFor(i,fleetSizes[sel]);if(!canPlace(cells,sel)){status.textContent="Tu statek się nie zmieści albo dotyka innego.";return}cells.forEach(x=>P[x]=sel+1);placed[sel]=true;sel=placed.findIndex(x=>!x);if(sel<0)sel=0;status.textContent=placed.every(Boolean)?"Flota gotowa. Możesz rozpocząć.":"Ustaw kolejny statek.";render()}
function randomFleet(arr){arr.fill(0);for(let id=0;id<fleetSizes.length;id++){let ok=false;while(!ok){let h=Math.random()<.5,len=fleetSizes[id],r=Math.floor(Math.random()*(h?10:11-len)),c=Math.floor(Math.random()*(h?11-len:10)),cells=Array.from({length:len},(_,k)=>(r+(h?0:k))*10+c+(h?k:0));let occupied=new Set(arr.map((v,i)=>v?i:-1).filter(i=>i>=0));if([...halo(cells)].every(i=>!occupied.has(i))){cells.forEach(i=>arr[i]=id+1);ok=true}}}}
function renderFleet(){let f=$("#fleet");f.innerHTML="";fleetSizes.forEach((len,i)=>{let b=document.createElement("button");b.className="shiptag"+(i===sel&&!placed[i]?" active":"");b.textContent=(placed[i]?"✓ ":"")+"▰".repeat(len);b.disabled=active||placed[i];b.onclick=()=>{sel=i;renderFleet()};f.append(b)})}
function render(){let p=$("#player"),e=$("#enemy");p.innerHTML=e.innerHTML="";for(let i=0;i<100;i++){let a=document.createElement("button");a.className="cell"+(P[i]?" ship":"")+(eShots.has(i)?(P[i]?" hit":" miss"):"");a.onclick=()=>placeAt(i);a.disabled=active;p.append(a);let q=document.createElement("button");q.className="cell"+(pShots.has(i)?(E[i]?" hit":" miss"):"");q.disabled=!active||lock||pShots.has(i);q.onclick=()=>fire(i);e.append(q)}renderFleet()}
function fire(i){pShots.add(i);status.textContent=E[i]?"Trafiony!":"Pudło.";render();if(E.every((v,j)=>!v||pShots.has(j)))return end(true);lock=true;setTimeout(cpu,360)}
function cpu(){let free=target.filter(i=>!eShots.has(i));let i=free.length?free[Math.floor(Math.random()*free.length)]:Array.from({length:100},(_,i)=>i).filter(i=>!eShots.has(i))[Math.floor(Math.random()*(100-eShots.size))];eShots.add(i);if(P[i]){let r=Math.floor(i/10),c=i%10;[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc])=>{if(rr>=0&&rr<10&&cc>=0&&cc<10&&!eShots.has(rr*10+cc))target.push(rr*10+cc)});status.textContent="Komputer trafił."}else status.textContent="Komputer spudłował.";target=target.filter(x=>!eShots.has(x));lock=false;render();if(P.every((v,j)=>!v||eShots.has(j)))end(false)}
function end(win){active=false;$("#result").textContent=win?"Wygrana! ⚓":"Flota zatopiona";$("#resultText").textContent=win?"Morze jest Twoje.":"Rewanż?";$("#modal").hidden=false}
function reset(){P.fill(0);E.fill(0);placed.fill(false);sel=0;active=false;lock=false;pShots.clear();eShots.clear();target=[];$("#enemyWrap").hidden=true;$("#modal").hidden=true;status.textContent="Wybierz statek i dotknij planszy.";render()}
$("#rotate").onclick=()=>{horiz=!horiz;$("#rotate").textContent=horiz?"↻ Poziomo":"↻ Pionowo"};$("#random").onclick=()=>{if(!active){randomFleet(P);placed.fill(true);status.textContent="Flota gotowa. Możesz rozpocząć.";render()}};$("#start").onclick=()=>{if(!placed.every(Boolean)){status.textContent="Najpierw ustaw całą flotę.";return}randomFleet(E);active=true;$("#enemyWrap").hidden=false;status.textContent="Twój ruch.";render();$("#enemyWrap").scrollIntoView({behavior:"smooth",block:"start"})};$("#new").onclick=reset;$("#again").onclick=reset;reset();
</script></body></html>
