<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Statki</title><style>
.boards{display:flex;flex-direction:column;gap:20px;width:min(100%,540px);margin:auto}.sea{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1;gap:2px;background:var(--line);padding:2px;border-radius:16px;overflow:hidden;touch-action:manipulation}.cell{border:0;padding:0;background:var(--card)}.cell.ship{background:#9aa7bd}.cell.selectedShip{background:var(--accent)}.cell.hit{background:#ef6a61}.cell.miss{background:#83b8d9}.cell.sunk{background:#7e2736;box-shadow:inset 0 0 0 2px #ffb0b0}.boards h3{text-align:center;margin:0 0 8px}.setup-controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.enemyWrap[hidden],.setup-controls[hidden]{display:none}.small-own{width:82%;margin:auto}.hint{font-size:13px;color:var(--muted);text-align:center;margin:5px 0 12px}
</style></head><body><header class="appbar"><div class="appbar-inner"><a class="back" href="../index.html">‹</a><div class="app-title">Statki</div><div class="spacer"></div><button class="btn" data-options>Opcje ▾</button><button class="btn" data-new>Nowa gra</button><button class="iconbtn" data-theme-button>◐</button></div></header>
<div class="game-options" id="options" hidden><div class="game-options-row"><span class="muted">Podczas ustawiania dotknij statku, potem pola docelowego. Ponowne dotknięcie zaznaczonego statku obraca go.</span></div></div>
<main class="shell"><div class="setup-controls" id="setup"><button class="btn" id="random">Losuj</button><button class="btn primary" id="start">Start</button></div><div class="hint" id="hint">Dotknij statku, aby go zaznaczyć. Potem dotknij miejsca, w które chcesz go przesunąć.</div>
<section class="boards"><div class="enemyWrap" id="enemyWrap" hidden><h3>Przeciwnik</h3><div class="sea" id="enemy"></div></div><div id="ownWrap"><h3>Twoja flota</h3><div class="sea" id="player"></div></div></section><div class="status" id="status"></div></main>
<div class="modal" id="modal" hidden><div class="modalbox"><h2 id="result"></h2><p id="resultText"></p><button class="btn primary" id="again">Jeszcze raz</button></div></div>
<script src="../js/app.js"></script><script>
const sizes=[4,3,3,2,2,2,1,1,1,1],$=s=>document.querySelector(s);let P=Array(100).fill(0),E=Array(100).fill(0),orient=Array(10).fill(true),selected=0,active=false,lock=false,pShots=new Set,eShots=new Set,target=[];
function neigh8(i){let r=Math.floor(i/10),c=i%10,a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let rr=r+dr,cc=c+dc;if(rr>=0&&rr<10&&cc>=0&&cc<10)a.push(rr*10+cc)}return a}
function cells(start,len,h){let r=Math.floor(start/10),c=start%10;if(h&&c+len>10||!h&&r+len>10)return null;return Array.from({length:len},(_,k)=>start+(h?k:k*10))}
function clearShip(arr,id){arr.forEach((v,i)=>{if(v===id+1)arr[i]=0})}
function can(arr,cs,id){if(!cs)return false;return cs.every(i=>neigh8(i).every(j=>!arr[j]||arr[j]===id+1))}
function place(arr,id,start,h){let old=arr.slice();clearShip(arr,id);let cs=cells(start,sizes[id],h);if(!can(arr,cs,id)){for(let i=0;i<100;i++)arr[i]=old[i];return false}cs.forEach(i=>arr[i]=id+1);return true}
function randomFleet(arr){arr.fill(0);for(let id=0;id<10;id++){while(true){let h=Math.random()<.5,start=Math.floor(Math.random()*100),cs=cells(start,sizes[id],h);if(can(arr,cs,id)){cs.forEach(i=>arr[i]=id+1);orient[id]=h;break}}}}
function shipSunk(arr,shots,id){return arr.every((v,i)=>v!==id||shots.has(i))}
function clickOwn(i){if(active)return;let id=P[i]?P[i]-1:null;if(id!==null){if(selected===id){let first=P.findIndex(v=>v===id+1);let old=orient[id];orient[id]=!old;if(!place(P,id,first,orient[id]))orient[id]=old}else selected=id}else if(selected!==null){if(place(P,selected,i,orient[selected])){}else $("#hint").textContent="Tu statek się nie zmieści albo dotyka innego."}render()}
function render(){let pl=$("#player"),en=$("#enemy");pl.innerHTML=en.innerHTML="";for(let i=0;i<100;i++){let id=P[i],a=document.createElement("button");a.className="cell"+(id?" ship":"")+(id&&selected===id-1&&!active?" selectedShip":"");if(eShots.has(i))a.className+=" "+(id&&shipSunk(P,eShots,id)?"sunk":id?"hit":"miss");a.onclick=()=>clickOwn(i);a.disabled=active;pl.append(a);let eid=E[i],q=document.createElement("button");q.className="cell";if(pShots.has(i))q.className+=" "+(eid&&shipSunk(E,pShots,eid)?"sunk":eid?"hit":"miss");q.disabled=!active||lock||pShots.has(i);q.onclick=()=>fire(i);en.append(q)}}
function fire(i){pShots.add(i);render();if(E.every((v,j)=>!v||pShots.has(j)))return end(true);lock=true;setTimeout(cpu,350)}
function cpu(){let choices=target.filter(i=>!eShots.has(i)),free=Array.from({length:100},(_,i)=>i).filter(i=>!eShots.has(i)),i=choices.length?choices[Math.floor(Math.random()*choices.length)]:free[Math.floor(Math.random()*free.length)];eShots.add(i);if(P[i]){let r=Math.floor(i/10),c=i%10;[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc])=>{if(rr>=0&&rr<10&&cc>=0&&cc<10&&!eShots.has(rr*10+cc))target.push(rr*10+cc)})}target=target.filter(x=>!eShots.has(x));lock=false;render();if(P.every((v,j)=>!v||eShots.has(j)))end(false)}
function start(){active=true;selected=null;randomFleet(E);$("#setup").hidden=true;$("#hint").hidden=true;$("#enemyWrap").hidden=false;$("#ownWrap").classList.add("small-own");$("#options").hidden=true;render();window.scrollTo({top:0,behavior:"smooth"})}
function reset(){active=false;lock=false;pShots.clear();eShots.clear();target=[];selected=0;randomFleet(P);E.fill(0);$("#setup").hidden=false;$("#hint").hidden=false;$("#enemyWrap").hidden=true;$("#ownWrap").classList.remove("small-own");$("#modal").hidden=true;render()}
function end(w){active=false;$("#result").textContent=w?"Wygrana! ⚓":"Flota zatopiona";$("#resultText").textContent=w?"Morze jest Twoje.":"Rewanż?";$("#modal").hidden=false}
$("#random").onclick=()=>{randomFleet(P);selected=0;render()};$("#start").onclick=start;document.querySelector("[data-new]").onclick=reset;$("#again").onclick=reset;document.querySelector("[data-options]").onclick=()=>{let o=$("#options");o.hidden=!o.hidden;document.querySelector("[data-options]").textContent=o.hidden?"Opcje ▾":"Opcje ▴"};reset();
</script></body></html>
