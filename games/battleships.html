<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Statki</title><style>
.boards{display:flex;flex-direction:column;gap:20px;width:min(100%,540px);margin:auto}.sea{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1;gap:2px;background:var(--line);padding:2px;border-radius:16px;overflow:hidden;touch-action:manipulation}.cell{border:0;padding:0;background:var(--card)}.cell.ship{background:#9aa7bd}.cell.hit{background:#ef6a61}.cell.miss{background:#83b8d9}.cell.sunk{background:#762b3b;box-shadow:inset 0 0 0 2px #ffc1c1}.boards h3{text-align:center;margin:0 0 8px}.setup{width:min(100%,540px);margin:0 auto 12px}.setupbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.dock{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;margin:11px 0}.dockship{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 10px;font-weight:800;min-height:42px}.dockship.active{outline:3px solid var(--accent);background:var(--soft)}.dockship[hidden]{display:none}.orient{min-width:106px}.enemyWrap[hidden],.setup[hidden]{display:none}.small-own{width:82%;margin:auto}.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:7px}
</style></head><body>
<header class="appbar"><div class="appbar-inner"><a class="back" href="../index.html">‹</a><div class="app-title">Statki</div><div class="spacer"></div><button class="btn" data-new>Nowa gra</button><button class="iconbtn" data-theme-button>◐</button></div></header>
<main class="shell">
<section class="setup card panel" id="setup"><div class="setupbar"><button class="btn orient" id="orient">↔ Poziomo</button><button class="btn" id="random">Losuj</button><button class="btn primary" id="start" disabled>Start</button></div><div class="dock" id="dock"></div><div class="hint" id="hint">Wybierz statek, orientację i dotknij miejsca na planszy.</div></section>
<section class="boards"><div class="enemyWrap" id="enemyWrap" hidden><h3>Przeciwnik</h3><div class="sea" id="enemy"></div></div><div id="ownWrap"><h3>Twoja flota</h3><div class="sea" id="player"></div></div></section><div class="status" id="status"></div>
</main><div class="modal" id="modal" hidden><div class="modalbox"><h2 id="result"></h2><p id="resultText"></p><button class="btn primary" id="again">Jeszcze raz</button></div></div>
<script src="../js/app.js"></script><script>
const sizes=[4,3,3,2,2,2,1,1,1,1],$=s=>document.querySelector(s);
let P=Array(100).fill(0),E=Array(100).fill(0),placed=Array(10).fill(false),selected=0,horizontal=true,active=false,lock=false,pShots=new Set,eShots=new Set,target=[];
function halo(i){let r=Math.floor(i/10),c=i%10,a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let rr=r+dr,cc=c+dc;if(rr>=0&&rr<10&&cc>=0&&cc<10)a.push(rr*10+cc)}return a}
function cells(start,len,h){let r=Math.floor(start/10),c=start%10;if(h&&c+len>10||!h&&r+len>10)return null;return Array.from({length:len},(_,k)=>start+(h?k:k*10))}
function can(arr,cs){return cs&&cs.every(i=>halo(i).every(j=>!arr[j]))}
function removeShip(id){P.forEach((v,i)=>{if(v===id+1)P[i]=0});placed[id]=false}
function placeSelected(start){if(selected===null)return;let cs=cells(start,sizes[selected],horizontal);if(!can(P,cs)){$("#hint").textContent="Tu się nie zmieści. Wybierz inne miejsce.";return}cs.forEach(i=>P[i]=selected+1);placed[selected]=true;let next=placed.findIndex(v=>!v);selected=next<0?null:next;$("#hint").textContent=selected===null?"Flota gotowa — możesz rozpocząć.":"Ustaw następny statek.";render()}
function clickOwn(i){if(active)return;if(P[i]){let id=P[i]-1;removeShip(id);selected=id;$("#hint").textContent="Statek zdjęty. Wybierz orientację i ustaw go ponownie.";render();return}placeSelected(i)}
function randomFleet(arr,savePlaced=false){arr.fill(0);for(let id=0;id<10;id++){while(true){let h=Math.random()<.5,start=Math.floor(Math.random()*100),cs=cells(start,sizes[id],h);if(can(arr,cs)){cs.forEach(i=>arr[i]=id+1);break}}}if(savePlaced){placed.fill(true);selected=null}}
function sunk(arr,shots,id){return arr.every((v,i)=>v!==id||shots.has(i))}
function renderDock(){let d=$("#dock");d.innerHTML="";sizes.forEach((len,id)=>{let b=document.createElement("button");b.className="dockship"+(selected===id?" active":"");b.textContent="▰".repeat(len);b.hidden=placed[id];b.onclick=()=>{selected=id;renderDock()};d.append(b)})}
function render(){let pl=$("#player"),en=$("#enemy");pl.innerHTML=en.innerHTML="";for(let i=0;i<100;i++){let id=P[i],a=document.createElement("button");a.className="cell"+(id?" ship":"");if(eShots.has(i))a.className+=" "+(id&&sunk(P,eShots,id)?"sunk":id?"hit":"miss");a.onclick=()=>clickOwn(i);a.disabled=active;pl.append(a);let eid=E[i],q=document.createElement("button");q.className="cell";if(pShots.has(i))q.className+=" "+(eid&&sunk(E,pShots,eid)?"sunk":eid?"hit":"miss");q.disabled=!active||lock||pShots.has(i);q.onclick=()=>fire(i);en.append(q)}renderDock();$("#start").disabled=!placed.every(Boolean)}
function fire(i){pShots.add(i);render();if(E.every((v,j)=>!v||pShots.has(j)))return end(true);lock=true;setTimeout(cpu,340)}
function cpu(){let candidates=target.filter(i=>!eShots.has(i)),free=Array.from({length:100},(_,i)=>i).filter(i=>!eShots.has(i)),i=candidates.length?candidates[Math.floor(Math.random()*candidates.length)]:free[Math.floor(Math.random()*free.length)];eShots.add(i);if(P[i]){let r=Math.floor(i/10),c=i%10;[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc])=>{if(rr>=0&&rr<10&&cc>=0&&cc<10&&!eShots.has(rr*10+cc))target.push(rr*10+cc)})}target=target.filter(x=>!eShots.has(x));lock=false;render();if(P.every((v,j)=>!v||eShots.has(j)))end(false)}
function start(){if(!placed.every(Boolean))return;randomFleet(E);active=true;selected=null;$("#setup").hidden=true;$("#enemyWrap").hidden=false;$("#ownWrap").classList.add("small-own");render();window.scrollTo({top:0,behavior:"smooth"})}
function reset(){P.fill(0);E.fill(0);placed.fill(false);selected=0;horizontal=true;active=false;lock=false;pShots.clear();eShots.clear();target=[];$("#setup").hidden=false;$("#enemyWrap").hidden=true;$("#ownWrap").classList.remove("small-own");$("#modal").hidden=true;$("#orient").textContent="↔ Poziomo";$("#hint").textContent="Wybierz statek, orientację i dotknij miejsca na planszy.";render()}
function end(win){active=false;$("#result").textContent=win?"Wygrana! ⚓":"Flota zatopiona";$("#resultText").textContent=win?"Morze jest Twoje.":"Rewanż?";$("#modal").hidden=false}
$("#orient").onclick=()=>{horizontal=!horizontal;$("#orient").textContent=horizontal?"↔ Poziomo":"↕ Pionowo"};$("#random").onclick=()=>{randomFleet(P,true);$("#hint").textContent="Flota gotowa — możesz rozpocząć.";render()};$("#start").onclick=start;document.querySelector("[data-new]").onclick=reset;$("#again").onclick=reset;reset();
</script></body></html>
