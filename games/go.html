<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Go</title><style>


.gob{position:relative;width:min(100%,620px);aspect-ratio:1;margin:auto;background:#d8ad63;border-radius:18px;padding:18px;box-sizing:border-box;overflow:hidden}
.go-inner{position:relative;width:100%;height:100%}
.grid{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.points{position:absolute;inset:0}
.pt{position:absolute;border:0;background:transparent;padding:0;transform:translate(-50%,-50%);touch-action:manipulation}
.stone{position:absolute;inset:8%;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.black{background:#17181b}.white{background:#f6f3eb;border:1px solid #bbb}.scoreline{text-align:center;margin:8px;color:var(--muted)}


</style></head><body><header class="appbar"><div class="appbar-inner"><a class="back" href="../index.html">‹</a><div class="app-title">Go</div><div class="spacer"></div><button class="btn" data-options>Opcje ▾</button><button class="btn" data-new>Nowa gra</button><button class="iconbtn" data-theme-button>◐</button></div></header>
<div class="game-options" id="options" hidden><div class="game-options-row"><label for="size">Plansza</label><select class="select" id="size"><option value="9">9×9</option><option value="13">13×13</option><option value="19">19×19</option></select><label for="level">CPU</label><select class="select" id="level"><option value="calm">Spokojny</option><option value="normal">Normalny</option><option value="clever">Sprytny</option></select></div></div>
<main class="shell"><section class="card panel"><div class="toolbar"><button class="btn" id="pass">Pas</button><span class="muted" id="turn"></span></div><div class="scoreline" id="caps"></div><div class="gob"><div class="go-inner"><canvas class="grid" id="grid" aria-hidden="true"></canvas><div class="points" id="points"></div></div></div><div id="status" hidden></div></section></main>
<div class="modal" id="modal" hidden><div class="modalbox"><h2>Koniec partii</h2><p id="summary"></p><button class="btn primary" id="again">Nowa partia</button></div></div>
<script src="../js/app.js"></script><script>
const $=s=>document.querySelector(s);let n=9,b=[],turn=1,passes=0,caps={1:0,2:0},previous="",busy=false;
function ns(i){let r=Math.floor(i/n),c=i%n,a=[];if(r)a.push(i-n);if(r<n-1)a.push(i+n);if(c)a.push(i-1);if(c<n-1)a.push(i+1);return a}
function group(start,a){let col=a[start],seen=new Set([start]),st=[start],libs=new Set();while(st.length){let i=st.pop();for(let j of ns(i)){if(a[j]===0)libs.add(j);else if(a[j]===col&&!seen.has(j)){seen.add(j);st.push(j)}}}return{stones:[...seen],libs}}
function simulate(i,col){if(b[i])return null;let a=b.slice();a[i]=col,cap=0;for(let j of ns(i))if(a[j]&&a[j]!==col){let g=group(j,a);if(!g.libs.size){cap+=g.stones.length;g.stones.forEach(x=>a[x]=0)}}let own=group(i,a);if(!own.libs.size||a.join("")===previous)return null;return{a,cap,libs:own.libs.size}}
function commit(i,col){let s=simulate(i,col);if(!s)return false;previous=b.join("");b=s.a;caps[col]+=s.cap;passes=0;turn=3-col;render();return true}
function human(i){if(turn!==1||busy)return;if(commit(i,1)){$("#status").textContent="CPU myśli…";busy=true;setTimeout(cpu,420)}else $("#status").textContent="Tego ruchu nie można zagrać."}
function cpuMoveInfo(i){
 let s=simulate(i,2);if(!s)return null;
 let own=group(i,s.a),friends=0,enemies=0,friendGroups=[],enemyGroups=[],seenF=new Set(),seenE=new Set();
 for(let j of ns(i)){
  if(b[j]===2){
   friends++;
   if(!seenF.has(j)){let g=group(j,b);friendGroups.push(g);g.stones.forEach(x=>seenF.add(x))}
  }else if(b[j]===1){
   enemies++;
   if(!seenE.has(j)){let g=group(j,b);enemyGroups.push(g);g.stones.forEach(x=>seenE.add(x))}
  }
 }

 let saved=0,urgentSave=0;
 for(let g of friendGroups){
  if(g.libs.size===1){saved+=g.stones.length;urgentSave+=g.stones.length*8}
  else if(g.libs.size===2)saved+=g.stones.length*.6;
 }

 let attack=0,atari=0;
 for(let g of enemyGroups){
  let afterStone=g.stones.find(x=>s.a[x]===1);
  if(afterStone!==undefined){
   let ag=group(afterStone,s.a);
   let before=g.libs.size,after=ag.libs.size;
   if(after<before)attack+=(before-after)*3;
   if(after===1){atari+=g.stones.length;attack+=8+g.stones.length*2}
  }
 }

 let joined=Math.max(0,friendGroups.length-1);
 let r=Math.floor(i/n),c=i%n,edge=Math.min(r,c,n-1-r,n-1-c);

 // Sama bliskość własnych kamieni nie jest już nagrodą.
 let score=s.cap*32 + own.libs.size*2.6 + joined*4 + saved*3 + urgentSave + attack + atari*4;
 score+=Math.min(edge,3)*.25 + Math.random()*1.6;

 // Kara za "stadko dla samego stadka".
 if(friends>0 && enemies===0 && s.cap===0 && attack===0 && urgentSave===0)score-=friends*2.4;

 // Oczywiste karmienie przeciwnika.
 let doomed=false;
 if(own.libs.size===1 && s.cap===0 && urgentSave===0){score-=45;doomed=true}
 if(own.libs.size===2 && s.cap===0 && enemies>=2 && urgentSave===0)score-=12;

 return {i,score,doomed,cap:s.cap,attack,urgentSave,libs:own.libs.size};
}
function cpuPass(message){
 passes++;turn=1;busy=false;render();$("#status").textContent=message||"CPU pasuje.";
 if(passes>=2)finish();
}
function cpu(){
 if(turn!==2){busy=false;return}
 let moves=[];
 for(let i=0;i<b.length;i++){let m=cpuMoveInfo(i);if(m)moves.push(m)}
 if(!moves.length){cpuPass("CPU pasuje — brak legalnego ruchu.");return}

 moves.sort((a,b)=>b.score-a.score);
 let sensible=moves.filter(m=>!m.doomed&&m.score>-6);
 if(!sensible.length){cpuPass("CPU pasuje — nie widzi sensownego ruchu.");return}

 let lvl=$("#level").value,choice;
 if(lvl==="calm"){
  // Łatwy: nadal popełnia błędy, ale wybiera spośród ruchów mających sens.
  let pool=sensible.slice(0,Math.min(7,sensible.length));
  choice=pool[Math.floor(Math.random()*pool.length)];
 }else if(lvl==="normal"){
  let pool=sensible.slice(0,Math.min(3,sensible.length));
  choice=pool[Math.floor(Math.random()*pool.length)];
 }else{
  choice=sensible[0];
 }
 commit(choice.i,2);busy=false;$("#status").textContent="Twój ruch.";
}
function boardGeometry(){
 const inner=document.querySelector(".go-inner"),box=inner.getBoundingClientRect();
 const size=Math.max(1,Math.floor(Math.min(box.width,box.height)));
 return {w:size,h:size};
}
function drawGrid(){
 const canvas=$("#grid"),{w,h}=boardGeometry(),dpr=window.devicePixelRatio||1;
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+"px";canvas.style.height=h+"px";
 const ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 ctx.strokeStyle="#6e532c";ctx.lineWidth=1;
 for(let k=0;k<n;k++){
   const rawX=k*w/(n-1),rawY=k*h/(n-1);
   const x=k===0?.5:k===n-1?w-.5:Math.round(rawX)+.5;
   const y=k===0?.5:k===n-1?h-.5:Math.round(rawY)+.5;
   ctx.beginPath();ctx.moveTo(x,.5);ctx.lineTo(x,h-.5);ctx.stroke();
   ctx.beginPath();ctx.moveTo(.5,y);ctx.lineTo(w-.5,y);ctx.stroke();
 }
}
function render(){
 const p=$("#points"),{w,h}=boardGeometry();
 p.style.width=w+"px";p.style.height=h+"px";
 drawGrid();p.innerHTML="";
 const step=Math.min(w,h)/(n-1),hit=Math.max(18,Math.min(step*.9,44));
 b.forEach((v,i)=>{
   const q=document.createElement("button"),r=Math.floor(i/n),c=i%n;
   q.className="pt";q.style.left=(c*w/(n-1))+"px";q.style.top=(r*h/(n-1))+"px";q.style.width=hit+"px";q.style.height=hit+"px";
   q.onclick=()=>human(i);
   if(v){const st=document.createElement("span");st.className="stone "+(v===1?"black":"white");q.append(st)}
   p.append(q)
 });
 $("#turn").textContent=busy?"CPU…":"Twój ruch ●";$("#caps").textContent=`Zbicia: Ty ${caps[1]} · CPU ${caps[2]}`
}
function reset(){n=+$("#size").value;b=Array(n*n).fill(0);turn=1;passes=0;caps={1:0,2:0};previous="";busy=false;$("#modal").hidden=true;render()}
$("#pass").onclick=()=>{if(busy)return;passes++;turn=2;if(passes>=2)return finish();busy=true;render();setTimeout(cpu,350)};function finish(){$("#summary").textContent=`Zbicia — Ty: ${caps[1]}, CPU: ${caps[2]}. To spokojny tryb: bez turniejowego rozstrzygania martwych grup.`;$("#modal").hidden=false}
const optionsBtn=document.querySelector("[data-options]"),optionsPanel=$("#options");
optionsBtn.addEventListener("click",()=>{optionsPanel.hidden=!optionsPanel.hidden;optionsBtn.textContent=optionsPanel.hidden?"Opcje ▾":"Opcje ▴"});
document.querySelector("[data-new]").onclick=reset;$("#again").onclick=reset;
$("#size").onchange=()=>{reset()};$("#level").onchange=()=>{render()};
reset();window.addEventListener("resize",()=>requestAnimationFrame(render));</script></body></html>
