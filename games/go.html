<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6fb"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Go</title><style>
.gob{position:relative;width:min(100%,620px);aspect-ratio:1;margin:auto;background:#d8ad63;border-radius:18px;padding:5%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}.grid{position:absolute;inset:5%;background-image:linear-gradient(#6e532c 1px,transparent 1px),linear-gradient(90deg,#6e532c 1px,transparent 1px);background-size:calc(100% / var(--n1)) calc(100% / var(--n1))}.points{position:absolute;inset:5%;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);transform:translate(calc(-50% / var(--n1)),calc(-50% / var(--n1)));width:calc(100% + 100% / var(--n1));height:calc(100% + 100% / var(--n1))}.pt{border:0;background:transparent;padding:0;position:relative}.stone{position:absolute;width:72%;aspect-ratio:1;border-radius:50%;left:14%;top:14%;box-shadow:0 2px 4px rgba(0,0,0,.35)}.black{background:#161719}.white{background:#f4f2eb;border:1px solid #bbb}.scoreline{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0}.scoreline b{font-size:18px}
</style></head><body><main class="shell"><header class="top"><a class="back" href="../index.html">‹</a><div class="brand">Go</div><div class="spacer"></div><select class="select" id="size"><option value="9">9×9</option><option value="13">13×13</option><option value="19">19×19</option></select><button class="iconbtn" data-theme-button>◐</button></header>
<section class="card panel"><div class="toolbar"><button class="btn" id="pass">Pas</button><button class="btn danger" id="reset">Nowa partia</button><span class="muted" id="turn"></span></div><div class="scoreline"><span>● Czarne: <b id="bc">0</b></span><span>○ Białe: <b id="wc">0</b></span></div><div class="gob" id="board"><div class="grid"></div><div class="points" id="points"></div></div><div class="status" id="status">Lokalna gra dla dwóch osób. Dwa kolejne pasy kończą partię.</div></section></main>
<div class="modal" id="modal" hidden><div class="modalbox"><h2>Koniec partii</h2><p id="summary"></p><div class="actions"><button class="btn primary" id="again">Nowa partia</button></div></div></div>
<script src="../js/app.js"></script><script>
const $=s=>document.querySelector(s);let n=9,b=[],turn=1,passes=0,caps={1:0,2:0},previous="";const pts=$("#points"),status=$("#status");
function neigh(i){let r=Math.floor(i/n),c=i%n,a=[];if(r)a.push(i-n);if(r<n-1)a.push(i+n);if(c)a.push(i-1);if(c<n-1)a.push(i+1);return a}
function group(start,arr=b){let color=arr[start],seen=new Set([start]),stack=[start],libs=new Set();while(stack.length){let i=stack.pop();for(const j of neigh(i)){if(arr[j]===0)libs.add(j);else if(arr[j]===color&&!seen.has(j)){seen.add(j);stack.push(j)}}}return {stones:[...seen],libs}}
function key(a){return a.join("")}
function play(i){if(b[i])return;let test=b.slice();test[i]=turn;let captured=[];for(const j of neigh(i))if(test[j]&&test[j]!==turn){let g=groupWith(j,test);if(!g.libs.size){captured.push(...g.stones);g.stones.forEach(x=>test[x]=0)}}let own=groupWith(i,test);if(!own.libs.size){status.textContent="Ruch samobójczy jest niedozwolony.";return}if(key(test)===previous){status.textContent="Ko: nie można odtworzyć poprzedniej pozycji.";return}previous=key(b);b=test;caps[turn]+=captured.length;passes=0;turn=3-turn;status.textContent=captured.length?`Zbito kamieni: ${captured.length}.`:"";save();render()}
function groupWith(start,arr){let color=arr[start],seen=new Set([start]),stack=[start],libs=new Set();while(stack.length){let i=stack.pop(),r=Math.floor(i/n),c=i%n;let ns=[];if(r)ns.push(i-n);if(r<n-1)ns.push(i+n);if(c)ns.push(i-1);if(c<n-1)ns.push(i+1);for(const j of ns){if(arr[j]===0)libs.add(j);else if(arr[j]===color&&!seen.has(j)){seen.add(j);stack.push(j)}}}return{stones:[...seen],libs}}
function render(){document.documentElement.style.setProperty("--n",n);document.documentElement.style.setProperty("--n1",n-1);pts.innerHTML="";b.forEach((v,i)=>{let p=document.createElement("button");p.className="pt";p.ariaLabel=`Pole ${Math.floor(i/n)+1}, ${i%n+1}`;if(v){let s=document.createElement("span");s.className="stone "+(v===1?"black":"white");p.append(s)}p.onclick=()=>play(i);pts.append(p)});$("#turn").textContent=turn===1?"Ruch: czarne ●":"Ruch: białe ○";$("#bc").textContent=caps[1];$("#wc").textContent=caps[2]}
function save(){localStorage.setItem("goState",JSON.stringify({n,b,turn,passes,caps,previous}))}
function reset(){n=+$("#size").value;b=Array(n*n).fill(0);turn=1;passes=0;caps={1:0,2:0};previous="";$("#modal").hidden=true;save();render()}
$("#pass").onclick=()=>{passes++;turn=3-turn;if(passes>=2){$("#summary").textContent=`Zbicia — czarne: ${caps[1]}, białe: ${caps[2]}. Przy pełnych zasadach Go wynik wymaga jeszcze oznaczenia martwych grup i policzenia terytorium.`;$("#modal").hidden=false}else{status.textContent="Pas.";save();render()}};
$("#reset").onclick=reset;$("#again").onclick=reset;$("#size").onchange=reset;
try{let s=JSON.parse(localStorage.getItem("goState"));if(s&&[9,13,19].includes(s.n)&&Array.isArray(s.b)&&s.b.length===s.n*s.n){n=s.n;b=s.b;turn=s.turn||1;passes=s.passes||0;caps=s.caps||{1:0,2:0};previous=s.previous||"";$("#size").value=n}else reset()}catch(e){reset()}render();
</script></body></html>
