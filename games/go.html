<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Go</title><style>
.gob{position:relative;width:min(100%,620px);aspect-ratio:1;margin:auto;background:#d8ad63;border-radius:18px;padding:5%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}.grid{position:absolute;inset:5%;background-image:linear-gradient(#6e532c 1px,transparent 1px),linear-gradient(90deg,#6e532c 1px,transparent 1px);background-size:calc(100% / var(--n1)) calc(100% / var(--n1))}.points{position:absolute;inset:5%;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);transform:translate(calc(-50% / var(--n1)),calc(-50% / var(--n1)));width:calc(100% + 100% / var(--n1));height:calc(100% + 100% / var(--n1))}.pt{border:0;background:transparent;padding:0;position:relative}.stone{position:absolute;width:72%;aspect-ratio:1;border-radius:50%;left:14%;top:14%;box-shadow:0 2px 4px rgba(0,0,0,.35)}.black{background:#17181b}.white{background:#f6f3eb;border:1px solid #bbb}.scoreline{text-align:center;margin:8px;color:var(--muted)}
</style></head><body><header class="appbar"><div class="appbar-inner"><a class="back" href="../index.html">‹</a><div class="app-title">Go</div><div class="spacer"></div><button class="iconbtn" data-theme-button>◐</button></div></header>
<main class="shell"><section class="card panel"><div class="toolbar"><select class="select" id="size"><option value="9">9×9</option><option value="13">13×13</option><option value="19">19×19</option></select><select class="select" id="level"><option value="calm">Spokojny</option><option value="normal">Normalny</option><option value="clever">Sprytny</option></select><button class="btn primary" id="reset">Nowa gra</button><button class="btn" id="pass">Pas</button><span class="muted" id="turn"></span></div><div class="scoreline" id="caps"></div><div class="gob"><div class="grid"></div><div class="points" id="points"></div></div><div class="status" id="status">Ty grasz czarnymi. CPU gra spokojnie, nie na życie i śmierć. 🙂</div></section></main>
<div class="modal" id="modal" hidden><div class="modalbox"><h2>Koniec partii</h2><p id="summary"></p><button class="btn primary" id="again">Nowa partia</button></div></div>
<script src="../js/app.js"></script><script>
const $=s=>document.querySelector(s);let n=9,b=[],turn=1,passes=0,caps={1:0,2:0},previous="",busy=false;
function ns(i){let r=Math.floor(i/n),c=i%n,a=[];if(r)a.push(i-n);if(r<n-1)a.push(i+n);if(c)a.push(i-1);if(c<n-1)a.push(i+1);return a}
function group(start,a){let col=a[start],seen=new Set([start]),st=[start],libs=new Set();while(st.length){let i=st.pop();for(let j of ns(i)){if(a[j]===0)libs.add(j);else if(a[j]===col&&!seen.has(j)){seen.add(j);st.push(j)}}}return{stones:[...seen],libs}}
function simulate(i,col){if(b[i])return null;let a=b.slice();a[i]=col,cap=0;for(let j of ns(i))if(a[j]&&a[j]!==col){let g=group(j,a);if(!g.libs.size){cap+=g.stones.length;g.stones.forEach(x=>a[x]=0)}}let own=group(i,a);if(!own.libs.size||a.join("")===previous)return null;return{a,cap,libs:own.libs.size}}
function commit(i,col){let s=simulate(i,col);if(!s)return false;previous=b.join("");b=s.a;caps[col]+=s.cap;passes=0;turn=3-col;render();return true}
function human(i){if(turn!==1||busy)return;if(commit(i,1)){status.textContent="CPU myśli…";busy=true;setTimeout(cpu,420)}else status.textContent="Tego ruchu nie można zagrać."}
function cpu(){if(turn!==2){busy=false;return}let moves=[];for(let i=0;i<b.length;i++){let s=simulate(i,2);if(s){let r=Math.floor(i/n),c=i%n,edge=Math.min(r,c,n-1-r,n-1-c),near=ns(i).filter(j=>b[j]).length;let score=s.cap*12+s.libs*1.5+near*1.2+Math.min(edge,3)*.5+Math.random()*6;moves.push([score,i])}}if(!moves.length){passes++;turn=1;busy=false;render();return}moves.sort((a,b)=>b[0]-a[0]);let lvl=$("#level").value,top=lvl==="calm"?Math.min(14,moves.length):lvl==="normal"?Math.min(7,moves.length):Math.min(3,moves.length);let choice=moves[Math.floor(Math.random()*top)][1];commit(choice,2);busy=false;status.textContent="Twój ruch."}
function render(){document.documentElement.style.setProperty("--n",n);document.documentElement.style.setProperty("--n1",n-1);let p=$("#points");p.innerHTML="";b.forEach((v,i)=>{let q=document.createElement("button");q.className="pt";q.onclick=()=>human(i);if(v){let s=document.createElement("span");s.className="stone "+(v===1?"black":"white");q.append(s)}p.append(q)});$("#turn").textContent=busy?"CPU…":"Twój ruch ●";$("#caps").textContent=`Zbicia: Ty ${caps[1]} · CPU ${caps[2]}`}
function reset(){n=+$("#size").value;b=Array(n*n).fill(0);turn=1;passes=0;caps={1:0,2:0};previous="";busy=false;$("#modal").hidden=true;render()}
$("#pass").onclick=()=>{if(busy)return;passes++;turn=2;if(passes>=2)return finish();busy=true;render();setTimeout(cpu,350)};function finish(){$("#summary").textContent=`Zbicia — Ty: ${caps[1]}, CPU: ${caps[2]}. To spokojny tryb: bez turniejowego rozstrzygania martwych grup.`;$("#modal").hidden=false}
$("#reset").onclick=reset;$("#again").onclick=reset;$("#size").onchange=reset;reset();
</script></body></html>
