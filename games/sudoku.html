<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Sudoku</title><style>
.sdk{width:min(100%,520px);margin:auto}.sboard{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;background:var(--text);gap:1px;border:2px solid var(--text)}.sq{border:0;background:var(--card);padding:0;font-size:clamp(18px,6vw,30px);font-weight:650}.sq:nth-child(3n){border-right:2px solid var(--text)}.sq:nth-child(9n){border-right:0}.sq:nth-child(n+19):nth-child(-n+27),.sq:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--text)}.sq.given{font-weight:900}.sq.peer{background:var(--soft)}.sq.same{background:color-mix(in srgb,var(--accent) 23%,var(--card))}.sq.sel{outline:3px solid var(--accent);outline-offset:-3px}.sq.bad{color:var(--danger)}.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.num{height:48px;border:0;border-radius:13px;background:var(--card);font-size:21px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.07)}.num[hidden]{visibility:hidden}.under{display:flex;justify-content:center;gap:8px;margin-top:10px}
</style></head><body>
<header class="appbar"><div class="appbar-inner"><a class="back" href="../index.html">‹</a><div class="app-title">Sudoku</div><div class="spacer"></div><select class="select" id="level"><option value="easy">Łatwe</option><option value="medium">Średnie</option><option value="hard">Trudne</option></select><button class="iconbtn" data-theme-button>◐</button></div></header>
<main class="shell"><section class="sdk"><div class="toolbar"><button class="btn primary" id="new">Nowa gra</button></div><div class="sboard" id="board"></div><div class="pad" id="pad"></div><div class="under"><button class="btn" id="undo">↶ Cofnij</button><button class="btn" id="check">Sprawdź</button></div><div class="status" id="status"></div></section></main>
<div class="modal" id="win" hidden><div class="modalbox"><h2>Gotowe ✨</h2><p>Plansza rozwiązana.</p><button class="btn primary" id="next">Nowa gra</button></div></div>
<script src="../js/app.js"></script><script>
const data={
easy:["530070000600195000098000060800060003400803001700020006060000280000419005000080079","534678912672195348198342567859761423426853791713924856961537284287419635345286179"],
medium:["003020600900305001001806400008102900700000008006708200002609500800203009005010300","483921657967345821251876493548132976729564138136798245372689514814253769695417382"],
hard:["300200000000107000706030500070009080900020004010800050009040301000702000000008006","351286497492157638786934512275469183938521764614873259829645371163792845547318926"]};
const $=s=>document.querySelector(s);let level=localStorage.getItem("sudokuDifficulty")||"easy",puzzle="",solution="",vals=[],selected=-1,hist=[],bad=new Set();
function transform(s,v){let out=Array(81);for(let r=0;r<9;r++)for(let c=0;c<9;c++){let rr=r,cc=c;if(v===1){rr=c;cc=r}if(v===2){rr=8-r;cc=8-c}if(v===3){rr=c;cc=8-r}let ch=s[rr*9+cc];out[r*9+c]=ch==="0"?"0":String((+ch+v-1)%9+1)}return out.join("")}
function fresh(){let v=Math.floor(Math.random()*4),d=data[level];puzzle=transform(d[0],v);solution=transform(d[1],v);vals=puzzle.split("");selected=-1;hist=[];bad.clear();localStorage.setItem("sudokuDifficulty",level);save();render()}
function save(){localStorage.setItem("sudokuState",JSON.stringify({level,puzzle,solution,vals}))}
function render(){let b=$("#board");b.innerHTML="";for(let i=0;i<81;i++){let q=document.createElement("button"),v=vals[i],r=Math.floor(i/9),c=i%9;q.className="sq"+(puzzle[i]!=="0"?" given":"");if(selected>=0){let sr=Math.floor(selected/9),sc=selected%9;if(r===sr||c===sc||Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3))q.classList.add("peer");if(v!=="0"&&v===vals[selected])q.classList.add("same");if(i===selected)q.classList.add("sel")}if(bad.has(i))q.classList.add("bad");q.textContent=v==="0"?"":v;q.onclick=()=>{selected=i;bad.clear();render()};b.append(q)}let counts={};vals.forEach(v=>counts[v]=(counts[v]||0)+1);document.querySelectorAll(".num[data-n]").forEach(x=>x.hidden=(counts[x.dataset.n]||0)>=9)}
function setv(v){if(selected<0||puzzle[selected]!=="0")return;hist.push([selected,vals[selected]]);vals[selected]=v;bad.delete(selected);save();render();if(vals.join("")===solution)$("#win").hidden=false}
for(let n=1;n<=9;n++){let x=document.createElement("button");x.className="num";x.dataset.n=n;x.textContent=n;x.onclick=()=>setv(String(n));$("#pad").append(x)}let del=document.createElement("button");del.className="num";del.textContent="⌫";del.onclick=()=>setv("0");$("#pad").append(del);
$("#undo").onclick=()=>{let h=hist.pop();if(h){vals[h[0]]=h[1];selected=h[0];save();render()}};$("#check").onclick=()=>{bad.clear();vals.forEach((v,i)=>{if(v!=="0"&&v!==solution[i]&&puzzle[i]==="0")bad.add(i)});$("#status").textContent=bad.size?`Do poprawy: ${bad.size}`:"Na razie wszystko pasuje.";render()};$("#new").onclick=fresh;$("#next").onclick=()=>{$("#win").hidden=true;fresh()};$("#level").value=level;$("#level").onchange=e=>{level=e.target.value;fresh()};
try{let s=JSON.parse(localStorage.getItem("sudokuState"));if(s&&s.level===level&&s.vals?.length===81){({puzzle,solution,vals}=s)}else fresh()}catch(e){fresh()}render();
</script></body></html>
