<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Saper</title><style>
.mine-panel{max-width:620px;margin:auto}
.mine-toolbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.mine-info{font-weight:800;color:var(--muted);white-space:nowrap}
.mine-board{width:min(100%,520px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(9,1fr);gap:3px;padding:6px;box-sizing:border-box;border-radius:16px;background:rgba(127,127,127,.16);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.mine-cell{appearance:none;border:0;border-radius:7px;padding:0;min-width:0;font:800 clamp(14px,5vw,25px)/1 system-ui,sans-serif;background:var(--card,#fff);box-shadow:inset 0 0 0 1px rgba(127,127,127,.22);color:inherit;touch-action:manipulation}
.mine-cell.open{background:rgba(127,127,127,.10);box-shadow:none}
.mine-cell.flag{font-size:clamp(15px,5vw,23px)}
.mine-cell.mine{background:rgba(220,70,70,.16)}
.mine-cell.n1{color:#2878d0}.mine-cell.n2{color:#2d8b57}.mine-cell.n3{color:#d64c4c}.mine-cell.n4{color:#6956bd}.mine-cell.n5{color:#9b542f}.mine-cell.n6{color:#168d94}.mine-cell.n7{color:#555}.mine-cell.n8{color:#888}
#flagMode.active{box-shadow:inset 0 0 0 2px currentColor}
.mine-status{display:flex;align-items:center;justify-content:center;text-align:center;height:44px;margin:10px 0 0;padding:0 10px;box-sizing:border-box;border-radius:12px;background:rgba(127,127,127,.08);font-weight:700;color:var(--muted)}
</style></head><body>
<header class="appbar"><div class="appbar-inner"><a class="back" href="../index.html">‹</a><div class="app-title">Saper</div><div class="spacer"></div><button class="btn" data-options>Opcje ▾</button><button class="btn" data-new>Nowa gra</button><button class="iconbtn" data-theme-button aria-label="Zmień motyw">◐</button></div></header>
<div class="game-options" id="options" hidden><div class="game-options-row"><label for="level">Poziom</label><select class="select" id="level"><option value="10">Łatwy · 10 min</option><option value="15" selected>Standard · 15 min</option><option value="20">Trudny · 20 min</option></select></div></div>
<main class="shell"><section class="card panel mine-panel">
<div class="mine-toolbar"><button class="btn" id="flagMode">🚩 Flaga</button><span class="mine-info" id="mineCount">Miny: 15</span></div>
<div class="mine-board" id="board" aria-label="Plansza Sapera"></div>
<div class="mine-status" id="status">Wybierz pole</div>
</section></main>
<script src="../js/app.js"></script><script>
const $=s=>document.querySelector(s),N=9;
let mineTotal=15,cells=[],started=false,ended=false,flagMode=false,opened=0;

function neighbors(i){
 const r=Math.floor(i/N),c=i%N,a=[];
 for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
  if(!dr&&!dc)continue;
  const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N)a.push(rr*N+cc)
 }
 return a
}
function reset(){
 mineTotal=+$("#level").value;cells=Array.from({length:N*N},()=>({mine:false,open:false,flag:false,n:0}));
 started=false;ended=false;flagMode=false;opened=0;
 $("#flagMode").classList.remove("active");$("#flagMode").textContent="🚩 Flaga";
 $("#status").textContent="Wybierz pole";render()
}
function placeMines(first){
 const safe=new Set([first,...neighbors(first)]),pool=[];
 for(let i=0;i<N*N;i++)if(!safe.has(i))pool.push(i);
 for(let k=pool.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]]}
 pool.slice(0,mineTotal).forEach(i=>cells[i].mine=true);
 cells.forEach((x,i)=>x.n=neighbors(i).filter(j=>cells[j].mine).length);started=true
}
function openCell(i){
 if(ended||cells[i].flag||cells[i].open)return;
 if(!started)placeMines(i);
 const x=cells[i];
 if(x.mine){x.open=true;lose();return}
 const stack=[i],seen=new Set();
 while(stack.length){
  const q=stack.pop();if(seen.has(q))continue;seen.add(q);
  const y=cells[q];if(y.open||y.flag||y.mine)continue;
  y.open=true;opened++;
  if(y.n===0)neighbors(q).forEach(j=>{if(!cells[j].open&&!cells[j].flag&&!cells[j].mine)stack.push(j)})
 }
 if(opened===N*N-mineTotal)win();else render()
}
function toggleFlag(i){
 if(ended||cells[i].open)return;
 cells[i].flag=!cells[i].flag;render()
}
function lose(){
 ended=true;cells.forEach(x=>{if(x.mine)x.open=true});
 $("#status").textContent="💥 Mina. Spróbuj jeszcze raz.";render()
}
function win(){
 ended=true;cells.forEach(x=>{if(x.mine)x.flag=true});
 $("#status").textContent="🎉 Plansza oczyszczona!";render()
}
function render(){
 const b=$("#board");b.innerHTML="";
 cells.forEach((x,i)=>{
  const q=document.createElement("button");q.className="mine-cell";q.type="button";
  if(x.open){q.classList.add("open");if(x.mine){q.classList.add("mine");q.textContent="💣"}else if(x.n){q.textContent=x.n;q.classList.add("n"+x.n)}}
  else if(x.flag){q.classList.add("flag");q.textContent="🚩"}
  q.onclick=()=>flagMode?toggleFlag(i):openCell(i);b.append(q)
 });
 const flags=cells.filter(x=>x.flag).length;
 $("#mineCount").textContent=`Miny: ${Math.max(0,mineTotal-flags)}`;
}
$("#flagMode").onclick=()=>{
 if(ended)return;flagMode=!flagMode;
 $("#flagMode").classList.toggle("active",flagMode);
 $("#flagMode").textContent=flagMode?"🚩 Flaga ✓":"🚩 Flaga";
 $("#status").textContent=flagMode?"Tryb flagowania":"Tryb odkrywania"
};
const optionsBtn=document.querySelector("[data-options]"),optionsPanel=$("#options");
optionsBtn.onclick=()=>{optionsPanel.hidden=!optionsPanel.hidden;optionsBtn.textContent=optionsPanel.hidden?"Opcje ▾":"Opcje ▴"};
document.querySelector("[data-new]").onclick=reset;
$("#level").onchange=reset;
reset();
</script></body></html>
