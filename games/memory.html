<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" href="../css/app.css"><title>Memory</title><style>
.memory-panel{max-width:620px;margin:auto}
.memory-toolbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.memory-info{font-weight:800;color:var(--muted);white-space:nowrap}
.memory-board{width:min(100%,520px);margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;box-sizing:border-box;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.memory-card{appearance:none;border:0;border-radius:10px;padding:0;min-width:0;width:100%;aspect-ratio:1;background:var(--card,#fff);box-shadow:inset 0 0 0 1px rgba(127,127,127,.25);color:inherit;font:800 clamp(22px,8vw,38px)/1 system-ui,sans-serif;touch-action:manipulation}
.memory-card.open{background:rgba(127,127,127,.10)}
.memory-card.matched{background:rgba(70,180,110,.14);box-shadow:inset 0 0 0 2px rgba(70,180,110,.45)}
.memory-status{display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px;margin:12px auto 0;padding:8px 12px;box-sizing:border-box;max-width:620px;font-weight:700;color:var(--muted)}
</style></head><body>
<header class="appbar"><div class="appbar-inner"><a class="back" href="../index.html">‹</a><div class="app-title">Memory</div><div class="spacer"></div><button class="btn" data-options>Opcje ▾</button><button class="btn" data-new>Nowa gra</button><button class="iconbtn" data-theme-button aria-label="Zmień motyw">◐</button></div></header>
<div class="game-options" id="options" hidden><div class="game-options-row"><label for="level">Poziom</label><select class="select" id="level"><option value="8">Łatwy · 8 par</option><option value="12" selected>Standard · 12 par</option><option value="16">Trudny · 16 par</option></select></div></div>
<main class="shell"><section class="card panel memory-panel">
<div class="memory-toolbar"><span class="memory-info" id="moves">Ruchy: 0</span><span class="memory-info" id="pairs">Pary: 0/12</span></div>
<div class="memory-board" id="board" aria-label="Plansza Memory"></div>
</section>
<section class="card memory-status" id="status">Znajdź wszystkie pary</section>
</main>
<script src="../js/app.js"></script><script>
const $=s=>document.querySelector(s);
const POOL=["●","■","▲","◆","★","♥","+","×","1","2","3","4","5","6","7","8","9","0","○","□","△","◇","✦","✚","÷","=","7","4","2","8"];
let pairTotal=12,cards=[],first=null,second=null,lock=false,moves=0,matched=0;

function shuffle(a){
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a
}
function makeSymbols(n){
 const unique=[...new Set(POOL)];
 return shuffle(unique).slice(0,n)
}
function reset(){
 pairTotal=+$("#level").value;
 const symbols=makeSymbols(pairTotal);
 cards=shuffle([...symbols,...symbols].map((symbol,id)=>({symbol,id,open:false,matched:false})));
 first=null;second=null;lock=false;moves=0;matched=0;
 $("#status").textContent="Znajdź wszystkie pary";
 render()
}
function choose(i){
 if(lock||cards[i].matched||cards[i].open)return;
 cards[i].open=true;
 if(first===null){first=i;render();return}
 second=i;moves++;
 if(cards[first].symbol===cards[second].symbol){
  cards[first].matched=cards[second].matched=true;
  matched++;first=null;second=null;
  if(matched===pairTotal){
   $("#status").textContent=`🎉 Wszystkie pary! Ruchy: ${moves}`;
  }
  render();return
 }
 lock=true;render();
 setTimeout(()=>{
  cards[first].open=false;cards[second].open=false;
  first=null;second=null;lock=false;render()
 },650)
}
function render(){
 const b=$("#board");b.innerHTML="";
 cards.forEach((x,i)=>{
  const q=document.createElement("button");q.type="button";q.className="memory-card";
  if(x.open||x.matched){q.textContent=x.symbol;q.classList.add("open")}
  else q.textContent="?";
  if(x.matched)q.classList.add("matched");
  q.onclick=()=>choose(i);b.append(q)
 });
 $("#moves").textContent=`Ruchy: ${moves}`;
 $("#pairs").textContent=`Pary: ${matched}/${pairTotal}`;
}
const optionsBtn=document.querySelector("[data-options]"),optionsPanel=$("#options");
optionsBtn.onclick=()=>{optionsPanel.hidden=!optionsPanel.hidden;optionsBtn.textContent=optionsPanel.hidden?"Opcje ▾":"Opcje ▴"};
document.querySelector("[data-new]").onclick=reset;
$("#level").onchange=reset;
reset();
</script></body></html>
