<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Sudoku</title>
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --text:#111111;
    --muted:#6b7280;
    --accent:#2563eb;
    --line:#c7c7cc;
    --thick:#111827;
    --given:#111111;
    --user:#2563eb;
    --bad:#dc2626;
    --selected:#dbeafe;
    --same:#e0ecff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:min(100%,520px);
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  h1{margin:0 0 8px;font-size:30px}
  .topbar{
    display:flex;
    gap:8px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .meta{color:var(--muted);font-size:14px}
  button{
    border:0;
    border-radius:12px;
    padding:11px 14px;
    font-size:16px;
    font-weight:600;
    background:var(--card);
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  button:active{transform:scale(.98)}
  .board{
    width:100%;
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(9,1fr);
    background:var(--card);
    border:2px solid var(--thick);
    border-radius:10px;
    overflow:hidden;
  }
  .cell{
    display:flex;
    align-items:center;
    justify-content:center;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    font-size:clamp(22px,7vw,34px);
    font-weight:600;
    user-select:none;
    background:#fff;
  }
  .cell:nth-child(9n){border-right:0}
  .cell:nth-child(n+73){border-bottom:0}
  .cell.c3,.cell.c6{border-right:2px solid var(--thick)}
  .cell.r3,.cell.r6{border-bottom:2px solid var(--thick)}
  .cell.same{background:var(--same)}
  .cell.selected{background:var(--selected)}
  .cell.given{color:var(--given)}
  .cell.user{color:var(--user)}
  .cell.bad{color:var(--bad)}
  .pad{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin-top:14px;
  }
  .num{font-size:20px;padding:14px 0}
  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
  }
  .message{
    min-height:24px;
    margin-top:12px;
    text-align:center;
    font-weight:600;
  }
  .hint{
    margin-top:12px;
    color:var(--muted);
    font-size:13px;
    line-height:1.4;
    text-align:center;
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <h1>Sudoku</h1>
      <div class="meta" id="timer">00:00</div>
    </div>
    <button id="newGame">Nowa gra</button>
  </div>

  <div class="board" id="board"></div>

  <div class="pad" id="pad"></div>

  <div class="actions">
    <button id="erase">Wyczyść pole</button>
    <button id="check">Sprawdź</button>
  </div>

  <div class="message" id="message"></div>
  <div class="hint">Dotknij pola, a potem wybierz cyfrę. Postęp zapisuje się automatycznie.</div>
</div>

<script>
const puzzles = [
  {
    puzzle:"530070000600195000098000060800060003400803001700020006060000280000419005000080079",
    solution:"534678912672195348198342567859761423426853791713924856961537284287419635345286179"
  },
  {
    puzzle:"000260701680070090190004500820100040004602900050003028009300074040050036703018000",
    solution:"435269781682571493197834562826195347374682915951743628519326874248957136763418259"
  },
  {
    puzzle:"300200000000107000706030500070009080900020004010800050009040301000702000000008006",
    solution:"351286497492157638786934512275469183938521764614873259829645371163792845547318926"
  },
  {
    puzzle:"003020600900305001001806400008102900700000008006708200002609500800203009005010300",
    solution:"483921657967345821251876493548132976729564138136798245372689514814253769695417382"
  }
];

let game, selected = -1, highlightedDigit = "", values = [], startedAt = Date.now(), timerId;

const board = document.getElementById("board");
const pad = document.getElementById("pad");
const message = document.getElementById("message");
const timer = document.getElementById("timer");

function newGame(){
  game = puzzles[Math.floor(Math.random()*puzzles.length)];
  values = game.puzzle.split("").map(x => x==="0" ? "" : x);
  selected = -1;
  highlightedDigit = "";
  startedAt = Date.now();
  message.textContent = "";
  render();
  save();
}

function render(){
  board.innerHTML = "";

  values.forEach((v,i)=>{
    const cell = document.createElement("div");
    const r = Math.floor(i/9)+1, c = (i%9)+1;
    cell.className = "cell";

    if (c===3 || c===6) cell.classList.add("c"+c);
    if (r===3 || r===6) cell.classList.add("r"+r);
    if (game.puzzle[i] !== "0") cell.classList.add("given");
    else if (v) cell.classList.add("user");

    if (highlightedDigit && v === highlightedDigit) cell.classList.add("same");
    if (i===selected) cell.classList.add("selected");

    cell.textContent = v;

    cell.onclick = ()=>{
      message.textContent = "";

      if (v) {
        if (highlightedDigit === v) {
          highlightedDigit = "";
          selected = -1;
        } else {
          highlightedDigit = v;
          selected = game.puzzle[i] === "0" ? i : -1;
        }
      } else if (game.puzzle[i] === "0") {
        highlightedDigit = "";
        selected = i;
      }

      render();
    };

    board.appendChild(cell);
  });

  renderPad();
}

function renderPad(){
  pad.innerHTML = "";

  for(let n=1;n<=9;n++){
    const digit = String(n);
    const used = values.filter(v => v === digit).length;

    if (used < 9) {
      const b = document.createElement("button");
      b.className = "num";
      b.textContent = n;
      b.onclick = ()=>{
        if(selected<0) return;
        values[selected] = digit;
        highlightedDigit = digit;
        render();
        save();
        if(values.every(Boolean)) checkBoard();
      };
      pad.appendChild(b);
    }
  }

  const zero = document.createElement("button");
  zero.className = "num";
  zero.textContent = "⌫";
  zero.onclick = erase;
  pad.appendChild(zero);
}

function erase(){
  if(selected<0) return;
  if(game.puzzle[selected]==="0"){
    values[selected]="";
    highlightedDigit="";
    message.textContent="";
    render();
    save();
  }
}

function checkBoard(){
  let wrong = 0;
  [...board.children].forEach((cell,i)=>{
    cell.classList.remove("bad");
    if(values[i] && values[i]!==game.solution[i] && game.puzzle[i]==="0"){
      cell.classList.add("bad");
      wrong++;
    }
  });
  if(wrong===0 && values.join("")===game.solution){
    message.textContent="Brawo! Sudoku rozwiązane 🎉";
  }else if(wrong===0){
    message.textContent="Na razie wszystko dobrze.";
  }else{
    message.textContent=`Błędne pola: ${wrong}`;
  }
}

function save(){
  localStorage.setItem("sudokuSave", JSON.stringify({
    puzzle: game.puzzle,
    solution: game.solution,
    values,
    startedAt
  }));
}

function load(){
  try{
    const s = JSON.parse(localStorage.getItem("sudokuSave"));
    if(s && s.puzzle && s.solution && Array.isArray(s.values)){
      game = {puzzle:s.puzzle, solution:s.solution};
      values = s.values;
      startedAt = s.startedAt || Date.now();
      selected = -1;
      highlightedDigit = "";
      render();
      return true;
    }
  }catch(e){}
  return false;
}

function tick(){
  const sec = Math.floor((Date.now()-startedAt)/1000);
  const m = String(Math.floor(sec/60)).padStart(2,"0");
  const s = String(sec%60).padStart(2,"0");
  timer.textContent = `${m}:${s}`;
}
timerId = setInterval(tick,1000);
tick();

document.getElementById("newGame").onclick = newGame;
document.getElementById("erase").onclick = erase;
document.getElementById("check").onclick = checkBoard;

if(!load()) newGame();
</script>
</body>
</html>
