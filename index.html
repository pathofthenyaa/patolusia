<!doctype html><html lang="pl" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6fb"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/app.css"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Mini Gry v2.8.9</title></head><body>
<header class="appbar"><div class="appbar-inner"><div class="home-title">Mini Gry v2.8.9</div><div class="spacer"></div><button class="btn" id="homeOptions">Opcje ▾</button><button class="iconbtn" data-theme-button aria-label="Zmień motyw">◐</button></div></header><div class="game-options" id="homeOptionsPanel" hidden><div class="game-options-row"><button class="btn primary" id="updateApp">Pobierz aktualizację</button><span class="muted" id="updateStatus">Czyści pliki PWA i pobiera je ponownie. Zapisy gier zostają.</span></div></div>
<main class="shell"><section class="homegrid">
<a class="card homecard" href="games/sudoku.html"><div class="homeart">⑨</div><span class="pill">LOGIKA</span><h2>Sudoku</h2><p>Trzy poziomy trudności</p></a>
<a class="card homecard" href="games/battleships.html"><div class="homeart">⚓</div><span class="pill">TAKTYKA</span><h2>Statki</h2><p>Ustaw flotę i graj z CPU</p></a>
<a class="card homecard" href="games/go.html"><div class="homeart">●</div><span class="pill">SPOKOJNIE</span><h2>Go</h2><p>Relaksacyjna partia z CPU</p></a>
</section></main><script src="js/app.js"></script><script>
const homeOptions=document.getElementById("homeOptions"),homePanel=document.getElementById("homeOptionsPanel");
homeOptions.addEventListener("click",()=>{homePanel.hidden=!homePanel.hidden;homeOptions.textContent=homePanel.hidden?"Opcje ▾":"Opcje ▴"});
document.getElementById("updateApp").addEventListener("click",async()=>{
 const b=document.getElementById("updateApp"),st=document.getElementById("updateStatus");
 b.disabled=true;b.textContent="Aktualizuję…";st.textContent="Usuwam stary cache…";
 try{
   if("serviceWorker" in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(r=>r.unregister()));
   }
   const keys=await caches.keys();
   await Promise.all(keys.filter(k=>k.startsWith("mini-gry-")).map(k=>caches.delete(k)));
   st.textContent="Pobieram świeżą wersję…";
   location.replace("./?refresh="+Date.now());
 }catch(e){
   st.textContent="Nie udało się automatycznie. Odśwież stronę.";
   b.disabled=false;b.textContent="Pobierz aktualizację";
 }
});
</script></body></html>
