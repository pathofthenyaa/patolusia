<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Go — Mini Gry</title>
<link rel="stylesheet" href="../css/app.css"><style>
.gob{position:relative;width:min(100%,620px);aspect-ratio:1;margin:auto;background:#d8ad63;border-radius:18px;padding:18px;box-sizing:border-box;overflow:hidden}
.go-inner{position:relative;width:100%;height:100%}.grid{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}.points{position:absolute;inset:0}
.pt{position:absolute;border:0;background:transparent;padding:0;transform:translate(-50%,-50%);touch-action:manipulation}.stone{position:absolute;inset:8%;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.black{background:#17181b}.white{background:#f6f3eb;border:1px solid #bbb}
</style></head><body>
<header class="topbar"><a class="iconbtn" href="../">‹</a><strong>Go</strong><button class="btn" id="opts">Opcje</button><button class="btn" id="new">Nowa gra</button><button class="iconbtn" data-theme-toggle>◐</button></header>
<main class="wrap"><section class="card"><div id="panel" hidden><label>Plansza <select id="size"><option value="9">9×9</option><option value="13">13×13</option><option value="19">19×19</option></select></label> <label>CPU <select id="cpu"><option value="0">Spokojny</option><option value="1" selected>Normalny</option><option value="2">Sprytny</option></select></label></div>
<div class="gob"><div class="go-inner"><canvas class="grid" id="grid"></canvas><div class="points" id="points"></div></div></div>
<div class="row"><button class="btn" id="pass">Pas</button><span id="score">Zbicia: Ty 0 · CPU 0</span></div></section></main>
<script src="../js/app.js"></script><script>
const $=s=>document.querySelector(s);let n=9,b=[],turn=1,cap=[0,0,0],ko=-1,passes=0,busy=false;
const nb=i=>{let r=Math.floor(i/n),c=i%n,a=[];if(r)a.push(i-n);if(r<n-1)a.push(i+n);if(c)a.push(i-1);if(c<n-1)a.push(i+1);return a};
function grp(i,board=b){let col=board[i],seen=new Set([i]),st=[i],libs=new Set;while(st.length){let x=st.pop();for(let y of nb(x)){if(board[y]===0)libs.add(y);else if(board[y]===col&&!seen.has(y)){seen.add(y);st.push(y)}}}return {s:[...seen],l:[...libs]}}
function legal(i,col,board=b){if(board[i]||i===ko)return null;let x=board.slice();x[i]=col,dead=[];for(let j of nb(i))if(x[j]===3-col){let g=grp(j,x);if(!g.l.length)dead.push(...g.s)};dead=[...new Set(dead)];dead.forEach(j=>x[j]=0);if(!grp(i,x).l.length)return null;return {x,dead}}
function boardGeometry(){const inner=document.querySelector(".go-inner"),box=inner.getBoundingClientRect();return {w:Math.max(1,box.width),h:Math.max(1,box.height)}}
function drawGrid(w,h){const canvas=$("#grid"),dpr=window.devicePixelRatio||1;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+"px";canvas.style.height=h+"px";const ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.strokeStyle="#6e532c";ctx.lineWidth=1;for(let k=0;k<n;k++){const rx=k*w/(n-1),ry=k*h/(n-1),x=k===0?.5:k===n-1?w-.5:rx,y=k===0?.5:k===n-1?h-.5:ry;ctx.beginPath();ctx.moveTo(x,.5);ctx.lineTo(x,h-.5);ctx.stroke();ctx.beginPath();ctx.moveTo(.5,y);ctx.lineTo(w-.5,y);ctx.stroke()}}
function render(){const p=$("#points"),{w,h}=boardGeometry();p.style.width=w+"px";p.style.height=h+"px";drawGrid(w,h);p.innerHTML="";const step=Math.min(w,h)/(n-1),hit=Math.max(18,Math.min(step*.9,44));b.forEach((v,i)=>{const q=document.createElement("button"),r=Math.floor(i/n),c=i%n;q.className="pt";q.style.left=(c*w/(n-1))+"px";q.style.top=(r*h/(n-1))+"px";q.style.width=hit+"px";q.style.height=hit+"px";q.onclick=()=>human(i);if(v){const st=document.createElement("span");st.className="stone "+(v===1?"black":"white");q.append(st)}p.append(q)});$("#score").textContent=`Zbicia: Ty ${cap[1]} · CPU ${cap[2]}`}
function play(i,col){let z=legal(i,col);if(!z)return false;b=z.x;cap[col]+=z.dead.length;ko=z.dead.length===1&&grp(i,b).s.length===1&&grp(i,b).l.length===1?z.dead[0]:-1;passes=0;render();return true}
function human(i){if(busy||turn!==1)return;if(play(i,1)){turn=2;busy=true;setTimeout(cpuMove,220)}}
function cpuMove(){let moves=[];for(let i=0;i<b.length;i++){let z=legal(i,2);if(z){let score=z.dead.length*30+grp(i,z.x).l.length*2+Math.random()*8;moves.push([score,i])}}if(!moves.length){passes++;turn=1;busy=false;render();return}moves.sort((a,c)=>c[0]-a[0]);play(moves[0][1],2);turn=1;busy=false}
function reset(){n=+$("#size").value;b=Array(n*n).fill(0);cap=[0,0,0];ko=-1;passes=0;turn=1;busy=false;render()}
$("#opts").onclick=()=>$("#panel").hidden=!$("#panel").hidden;$("#new").onclick=reset;$("#size").onchange=reset;$("#pass").onclick=()=>{if(busy)return;passes++;ko=-1;turn=2;busy=true;setTimeout(cpuMove,220)};
window.addEventListener("resize",render);reset();
</script></body></html>
