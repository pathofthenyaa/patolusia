<!doctype html>
<html lang="pl" data-theme="auto">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6fb"><meta name="robots" content="noindex,nofollow,noarchive">
<link rel="stylesheet" href="../css/app.css"><title>Losowanie</title>
<style>
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.top h1{margin:0;font-size:26px}.back{text-decoration:none}.chooser{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{padding:18px}.box h2{margin:0 0 6px}.bigicon{font-size:46px;margin-bottom:8px}.muted2{opacity:.72;font-size:14px;line-height:1.35}.controls{display:grid;gap:12px;margin-top:18px}.row{display:flex;gap:8px;flex-wrap:wrap}.choice{flex:1;min-width:90px}.choice.active{outline:2px solid currentColor}.sessionline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:14px;background:color-mix(in srgb,currentColor 6%,transparent)}
.switch{position:relative;width:52px;height:30px;flex:none}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:999px;background:#8b8f99;transition:.2s}.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}.switch input:checked+.slider{background:#3478f6}.switch input:checked+.slider:before{transform:translateX(22px)}
.generate{width:100%;font-size:18px;padding:13px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:18px;z-index:50}.overlay[hidden]{display:none}.result{width:min(520px,100%);text-align:center;padding:24px}.result-label{font-size:14px;opacity:.7}.value{font-size:clamp(84px,25vw,150px);font-weight:800;line-height:1;margin:24px 0}.value.number{font-size:clamp(64px,20vw,120px);overflow-wrap:anywhere}.status{min-height:22px;margin-bottom:18px;opacity:.75}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions .primary{grid-column:1/-1}.empty-note{font-size:13px;opacity:.65;margin-top:8px}
@media(max-width:620px){.chooser{grid-template-columns:1fr}.wrap{padding-top:12px}}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-inner"><a class="btn back" href="../index.html">← Gry</a><div class="home-title">Losowanie</div><div class="spacer"></div><button class="iconbtn" data-theme-button aria-label="Zmień motyw">◐</button></div></header>
<main class="wrap">
<div class="chooser">
<section class="card box">
<div class="bigicon">A</div><h2>Losowa litera</h2><div class="muted2">Praktyczna pula do Państwa–Miasta: 27 liter.</div>
<div class="controls">
<div class="sessionline"><div><strong>Sesja bez powtórek</strong><div class="muted2">Wylosowana litera wypada z puli.</div></div><label class="switch"><input id="letterSession" type="checkbox" checked><span class="slider"></span></label></div>
<div id="letterPool" class="muted2">W puli: 32 z 32</div>
<button class="btn primary generate" id="drawLetter">Losuj literę</button>
</div></section>
<section class="card box">
<div class="bigicon">#</div><h2>Losowa liczba</h2><div class="muted2">Wybierz zakres i wylosuj liczbę całkowitą.</div>
<div class="controls"><div class="row" id="ranges">
<button class="btn choice active" data-max="10">1–10</button><button class="btn choice" data-max="100">1–100</button><button class="btn choice" data-max="1000">1–1000</button><button class="btn choice" data-max="10000">1–10000</button>
</div><div id="rangeInfo" class="muted2">Zakres: 1–10</div><button class="btn primary generate" id="drawNumber">Losuj liczbę</button></div>
</section>
</div>
</main>
<div class="overlay" id="resultOverlay" hidden><section class="card result">
<div class="result-label" id="resultLabel">Wylosowano</div><div class="value" id="resultValue">A</div><div class="status" id="resultStatus"></div>
<div class="actions"><button class="btn primary" id="drawAgain">Losuj nowe</button><button class="btn" id="newSession">Nowa sesja</button><button class="btn" id="closeResult">Zamknij</button></div>
</section></div>
<script src="../js/app.js"></script>
<script>
const LETTERS=["A","B","C","Ć","D","E","F","G","H","I","J","K","L","Ł","M","N","O","P","R","S","Ś","T","U","W","Z","Ź","Ż"];
let remaining=[...LETTERS], max=10, mode=null;
const $=id=>document.getElementById(id), session=$("letterSession"), pool=$("letterPool"), overlay=$("resultOverlay"), value=$("resultValue"), status=$("resultStatus"), label=$("resultLabel");
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function updatePool(){pool.textContent=session.checked?`W puli: ${remaining.length} z ${LETTERS.length}`:"Powtórki są dozwolone"}
function resetLetters(){remaining=[...LETTERS];updatePool()}
function show(type,val){mode=type;label.textContent=type==="letter"?"Wylosowana litera":"Wylosowana liczba";value.textContent=val;value.classList.toggle("number",type==="number");status.textContent=type==="letter"&&session.checked?`Pozostało liter: ${remaining.length}`:`Zakres: 1–${max}`;overlay.hidden=false}
function drawLetter(){if(session.checked){if(!remaining.length){resetLetters();status.textContent="Pula została odnowiona."}const i=Math.floor(Math.random()*remaining.length),v=remaining.splice(i,1)[0];updatePool();show("letter",v);if(!remaining.length)status.textContent="To była ostatnia litera w tej sesji."}else show("letter",pick(LETTERS))}
function drawNumber(){show("number",Math.floor(Math.random()*max)+1)}
$("drawLetter").onclick=drawLetter;$("drawNumber").onclick=drawNumber;
session.onchange=()=>{resetLetters()};
$("ranges").onclick=e=>{const b=e.target.closest("[data-max]");if(!b)return;max=Number(b.dataset.max);document.querySelectorAll("[data-max]").forEach(x=>x.classList.toggle("active",x===b));$("rangeInfo").textContent=`Zakres: 1–${max}`};
$("drawAgain").onclick=()=>mode==="letter"?drawLetter():drawNumber();
$("newSession").onclick=()=>{if(mode==="letter")resetLetters();overlay.hidden=true};
$("closeResult").onclick=()=>overlay.hidden=true;
overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.hidden=true});
updatePool();
</script></body></html>
